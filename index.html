<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaadi Khata</title>
<style>

:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#a1a1a6;
  --line:rgba(0,0,0,.08); --glass:rgba(245,245,247,.88); --track:rgba(120,120,128,.14);
  --blue:#0071e3; --green:#248a3d; --orange:#d97706; --red:#e5342b; --purple:#a248d8; --teal:#1c8fc4; --pink:#ff375f; --gray:#8e8e93;
  --ntorq:#f26b1d; --scr:#0a9396; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#6e6e73;
    --line:rgba(255,255,255,.1); --glass:rgba(0,0,0,.8); --track:rgba(120,120,128,.28);
    --blue:#2997ff; --green:#32d74b; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#32ade6; --ntorq:#ff8a3d; --scr:#2ec4b6; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --ink2:#a1a1a6; --ink3:#6e6e73;
  --line:rgba(255,255,255,.1); --glass:rgba(0,0,0,.8); --track:rgba(120,120,128,.28);
  --blue:#2997ff; --green:#32d74b; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2; --teal:#32ade6; --ntorq:#ff8a3d; --scr:#2ec4b6; --shadow:none;
}
html{height:auto;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 120px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
button{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin:0 -20px;padding:10px 20px;
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;transition:border-color .25s;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar.scrolled{border-bottom-color:var(--line)}
.bar b{font-weight:600;font-size:17px;letter-spacing:-.01em}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;padding:6px 12px;border-radius:99px;white-space:nowrap}
.nav a:hover{background:var(--track);color:var(--ink)}

/* hero */
.hero{padding:44px 0 8px}
.hero h1{margin:0;font-weight:700;font-size:clamp(40px,9vw,72px);line-height:1.02;letter-spacing:-.035em}
.hero p{margin:10px 0 0;color:var(--ink2);font-size:clamp(17px,2.4vw,21px);letter-spacing:-.01em;max-width:34ch}
.total{margin-top:34px;font-weight:700;letter-spacing:-.045em;line-height:1;font-size:clamp(52px,14vw,112px);font-variant-numeric:tabular-nums}
.total span{font-weight:600;color:var(--ink3);font-size:.5em;margin-right:.08em;letter-spacing:-.02em}
.sub{margin-top:10px;color:var(--ink2);font-size:15px}
.chartbox{margin:26px -4px 0;position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;
  box-shadow:0 6px 24px rgba(0,0,0,.18);opacity:0;transition:opacity .15s;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}
.tip b{display:block;font-size:15px;letter-spacing:-.01em}
.tip span{color:var(--ink2)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
.stat{background:var(--card);border-radius:22px;padding:18px 18px 20px;box-shadow:var(--shadow)}
.stat .n{font-size:clamp(24px,5.4vw,40px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.stat .l{color:var(--ink2);font-size:13px;margin-top:6px;line-height:1.3}

section{margin-top:72px}
h2{margin:0 0 6px;font-size:clamp(26px,5vw,36px);font-weight:700;letter-spacing:-.03em;line-height:1.1}
.lede{margin:0 0 22px;color:var(--ink2);font-size:17px;max-width:48ch}
.card{background:var(--card);border-radius:26px;padding:22px;box-shadow:var(--shadow)}

/* years */
.years{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end;height:220px;padding-top:6px}
.yr{display:flex;flex-direction:column;justify-content:flex-end;height:100%;align-items:stretch;text-align:center;border:0;background:none;padding:0;cursor:pointer}
.yr .bw{flex:1;display:flex;align-items:flex-end}
.yr .b{display:flex;flex-direction:column-reverse;overflow:hidden;width:100%;border-radius:12px 12px 6px 6px;background:var(--track);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1),background .25s}
.yr.on .b,.yr:hover .b{background:var(--acc,var(--blue))}
.yr .v{font-size:13px;font-weight:600;margin-bottom:6px}
.yr .y{font-size:13px;color:var(--ink2);margin-top:8px}
.yr.on .y{color:var(--ink);font-weight:600}

/* categories */
.cat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-top:1px solid var(--line)}
.cat:first-child{border-top:0;padding-top:0}
.cat .nm{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cat .am{font-weight:600;text-align:right}
.cat .tr{grid-column:1/-1;height:8px;border-radius:99px;background:var(--track);margin-top:8px;overflow:hidden}
.cat .tr i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.cat .pc{grid-column:1/-1;color:var(--ink2);font-size:13px}

/* segmented control */
.seg{display:flex;gap:4px;background:var(--track);padding:3px;border-radius:12px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;padding:7px 14px;border-radius:9px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;transition:background .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}

/* repeats */
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.sum3 .stat .n{font-size:clamp(22px,5vw,34px)}
.sum3 .stat i{display:block;width:28px;height:4px;border-radius:4px;margin-bottom:12px}
.rp{background:var(--card);border-radius:24px;padding:20px;box-shadow:var(--shadow);margin-top:12px}
.rp-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rp-h b{display:block;font-size:19px;letter-spacing:-.02em;line-height:1.2}
.rp-h small{color:var(--ink2);font-size:14px}
.pill{flex:none;font-size:12px;font-weight:600;color:#fff;background:var(--vc);padding:4px 11px;border-radius:99px;white-space:nowrap}
.strip{position:relative;height:22px;margin:18px 6px 0}
.strip::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--track);border-radius:2px}
.strip i{position:absolute;top:50%;width:var(--ds,12px);height:var(--ds,12px);margin:calc(var(--ds,12px)/-2) 0 0 calc(var(--ds,12px)/-2);border-radius:50%;background:var(--vc);box-shadow:0 0 0 3px var(--card)}
.yrs{position:relative;height:18px;margin:2px 6px 0;font-size:11px;color:var(--ink3)}
.yrs span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.yrs span:first-child{transform:none}
.say{margin:10px 0 0;font-size:15px;line-height:1.45}
.guide{margin:6px 0 0;font-size:14px;color:var(--ink2);line-height:1.45}
.guide b{color:var(--vc);font-weight:600}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rchips span{font-size:12px;font-weight:600;color:#fff;background:var(--vc);padding:3px 10px;border-radius:99px}

/* compare */
.cmp-top{background:var(--card);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow)}
.cmp-top .k{color:var(--ink2);font-size:15px}
.cmp-top .big2{font-size:clamp(44px,11vw,84px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.good{color:var(--green)}
.bad{color:var(--orange)}
.cmp-top .alt{font-size:15px;color:var(--ink2);margin:0}
.bars{margin-top:22px;display:grid;gap:12px}
.bl{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;font-size:14px}
.bl .tr{height:12px;border-radius:99px;background:var(--track);overflow:hidden}
.bl .tr i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bl b{font-variant-numeric:tabular-nums;font-weight:600}
.cmp-ctl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 0}
.cmp-ctl .seg{margin:0}
.cmp-ctl small{display:block;color:var(--ink2);font-size:12px;margin:0 4px 6px}
.list{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.rh{width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:16px 18px;border:0;background:none;text-align:left;cursor:pointer}
.rh:hover{background:var(--track)}
.ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.rt b{display:block;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.rt span{color:var(--ink2);font-size:13px}
.ra{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.chev{width:10px;height:10px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg);transition:transform .25s;margin-right:4px}
.row.open .chev{transform:rotate(225deg)}
.rb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.row.open .rb{grid-template-rows:1fr}
.rb>div{overflow:hidden}
.rbi{padding:2px 18px 20px 72px}
.cmp .rh{grid-template-columns:1fr auto auto}
.cmp .rbi{padding:2px 18px 20px}
.flds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fld{min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{box-sizing:border-box}
.fld input{min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--track);border:0;border-radius:12px;padding:10px 12px;width:100%;font-variant-numeric:tabular-nums}
.basis{margin:12px 0 0;font-size:14px;color:var(--ink2);line-height:1.45}
.cf{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--track);color:var(--ink);margin-right:6px;vertical-align:1px}
.caveat{margin-top:12px;background:var(--card);border-radius:24px;padding:20px 22px;box-shadow:var(--shadow)}
.caveat h3{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
.caveat p{margin:8px 0 0;font-size:15px;color:var(--ink2);line-height:1.45}
.caveat p b{color:var(--ink);font-weight:600}

/* bills */
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;font-size:13px;color:var(--ink2)}
.chips span{display:inline-flex;align-items:center;gap:6px}
.chips .dot{width:8px;height:8px}
.chips b{color:var(--ink);font-weight:600}
.note{margin-top:12px;font-size:14px;color:var(--ink);background:var(--track);border-radius:12px;padding:10px 12px;line-height:1.4}

footer{margin-top:56px;color:var(--ink3);font-size:13px;line-height:1.5;max-width:62ch}
@media (max-width:560px){
  .wrap{padding:0 16px 70px}.bar{margin:0 -16px;padding:10px 16px}
  .stats,.sum3{gap:8px}.stat{padding:14px;border-radius:18px}
  .rh{grid-template-columns:auto 1fr auto;gap:12px;padding:14px}
  .cmp .rh{grid-template-columns:1fr auto}
  .rh .chev{display:none}
  .rbi{padding:2px 14px 18px 14px}.cmp .rbi{padding:2px 14px 18px}
  .card{padding:18px;border-radius:22px}
  .bl{grid-template-columns:70px 1fr auto;gap:10px}
  .cmp-ctl{grid-template-columns:1fr}
  .bar b{display:none}.nav{margin:0 -4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* vehicle switcher */
.vseg{margin:0;flex:1 1 auto;max-width:340px}
.vseg button{padding:6px 12px}
#view{--acc:var(--blue)}
.stk .yr .b,.stk .yr.on .b,.stk .yr:hover .b{background:none}
.stk .yr .b i{display:block;width:100%}
.stk .yr .b i{opacity:.55;transition:opacity .25s}
.stk .yr.on .b i,.stk .yr:hover .b i{opacity:1}
.legend{display:flex;gap:16px;margin-top:14px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fn{margin:12px 2px 0;font-size:13px;color:var(--ink3)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.vcard{text-align:left;border:0;cursor:pointer;background:var(--card);border-radius:26px;padding:20px;box-shadow:var(--shadow);display:block;width:100%}
.vcard:hover{background:var(--track)}
.vcard b{display:block;font-size:19px;letter-spacing:-.02em}
.vcard small{color:var(--ink2);font-size:13px}
.vcard .vn{margin-top:14px;font-size:clamp(28px,6vw,38px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.vcard .vb{height:8px;border-radius:99px;background:var(--track);margin-top:14px;overflow:hidden}
.vcard .vb i{display:block;height:100%;border-radius:99px;background:var(--vc)}
.vcard .vp{margin-top:8px;color:var(--ink2);font-size:13px}
.vtag{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.vtag i{width:8px;height:8px;border-radius:50%;background:var(--vc);display:inline-block}
.est .ra{color:var(--ink2)}
@media (max-width:560px){.nav{display:none}.vseg{max-width:none}}


.jump{display:inline-block;margin-top:16px;padding:9px 18px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none}
.kd{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.kd summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px}
.kd summary::-webkit-details-marker{display:none}
.kd summary b{display:block;font-size:17px;letter-spacing:-.01em}
.kd summary small{color:var(--ink2);font-size:13px}
.kd[open] .chev{transform:rotate(225deg)}
.kdb{padding:0 18px 18px}
.kv{margin:0}
.kv>div{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.35}
.kv dt{color:var(--ink2);flex:0 1 42%}
.kv dd{margin:0;text-align:right;flex:1 1 auto;word-break:break-word;font-variant-numeric:tabular-nums}
.kv .when{color:var(--ink2);font-size:13px}
.kv .past dd>.when:first-of-type{color:var(--orange);font-weight:600}
.kl{margin:12px 0 0;padding-left:18px;font-size:15px;line-height:1.45}
.kl li{margin:6px 0}
.kn{margin:12px 0 0;font-size:14px;color:var(--ink2)}
.tel{color:var(--blue);font-weight:600;text-decoration:none}

.pkbig{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px}
.pkbig .big{font-size:clamp(46px,13vw,76px);font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pkbig .big small{margin-left:8px}
.pkbig .big small,.pk .pkn small{font-size:15px;color:var(--ink2);font-weight:600;letter-spacing:0}
.pkt{color:var(--ink2);font-size:14px}
.pkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.pk{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.pk b{display:flex;align-items:center;gap:8px;font-size:17px;letter-spacing:-.01em}
.pk .dot{width:10px;height:10px}
.pk .pkn{font-size:34px;font-weight:700;letter-spacing:-.03em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
.pk p{margin:10px 0 0;font-size:14px;color:var(--ink2);line-height:1.4}
.ptab{padding:12px 14px;overflow-x:auto}
.ptab table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ptab th{font-weight:500;color:var(--ink2);text-align:right;padding:6px 4px;font-size:12px}
.ptab td{text-align:right;padding:12px 4px;border-top:1px solid var(--line)}
.ptab td:first-child,.ptab th:first-child{text-align:left}
.years.dense{gap:4px}.years.dense .v{font-size:10px;letter-spacing:-.02em}.years.dense .y{font-size:11px}

.btn{border:0;border-radius:12px;background:var(--acc,var(--blue));color:#fff;font-weight:600;padding:12px 20px;font-size:16px;cursor:pointer}
.btn.alt{background:var(--track);color:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:15px}
.chk input{width:20px;height:20px}
.fmsg{font-size:14px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.frow:first-child{border-top:0}
.frow b{display:block;font-weight:600}
.frow small{color:var(--ink2);font-size:13px}
.fk{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:right}
.fk small{font-size:12px;font-weight:500;color:var(--ink2)}
textarea.bk{width:100%;font:16px/1.4 ui-monospace,Menlo,monospace;background:var(--track);color:var(--ink);border:0;border-radius:12px;padding:10px 12px;resize:vertical}
.fld input[type=date]{min-height:44px}

.fld select{font:inherit;font-size:17px;color:var(--ink);background:var(--track);border:0;border-radius:12px;padding:11px 12px;width:100%;-webkit-appearance:none;appearance:none}
.fld input[type=search]{-webkit-appearance:none;appearance:none;min-height:44px}
.fld input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:var(--track);border:0;border-radius:12px;padding:10px 12px;width:100%}
.cpk-ins{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:2px 14px;margin:0 0 16px}
.cpk-ins div{padding:11px 0;font-size:14px;line-height:1.4;border-top:1px solid var(--line)}
.cpk-ins div:first-child{border-top:0}
.cpk-ins b{font-weight:600}
.cpk-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink2);background:var(--track);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.cpk-seg button{padding:7px 8px;font-size:13px}
.cpk-st .stat .n{font-size:clamp(17px,5vw,26px);white-space:nowrap}
.cpk-up{color:var(--red)}.cpk-dn{color:var(--green)}
.cpk-res{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--line);margin-top:14px;padding-top:12px;font-size:15px}
.cpk-res b{font-size:20px;white-space:nowrap;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qf-big{display:block;width:100%;font:inherit;font-size:22px;font-weight:600;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}

<body>
<div class="wrap" id="top">
  <div class="bar" id="bar">
    <div class="seg vseg" id="vseg" role="group" aria-label="Choose" hidden></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
  </div>
  <div id="view"></div>
  <footer id="foot"></footer>
</div>
<nav class="bnav" id="bnav" aria-label="Main"><div><button data-bn="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>Home</button><button data-bn="add"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Add</button><button data-bn="veh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15l1.5-5a2 2 0 0 1 2-1.5h9a2 2 0 0 1 2 1.5L20 15v3H4z"/><circle cx="8" cy="18" r="1.6"/><circle cx="16" cy="18" r="1.6"/></svg>Vehicles</button><button data-bn="ins"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Insights</button><button data-bn="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg>More<i id="bn_badge" hidden></i></button></div></nav>
<script>
(function(){

const CFG_KEY='vehicleLedger.family.cfg';
let CFG=null;
try{CFG=JSON.parse(localStorage.getItem(CFG_KEY)||'null')}catch(e){}
if(CFG&&!(CFG.vehicles&&CFG.vehicles.length))CFG=null;
if(!CFG||location.hash==='#setup'){setupScreen(CFG);return}
function setupScreen(old){
  const SL=['altis','ntorq','scr'];
  const ev=old?old.vehicles:[];
  const today=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})();
  const esc=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  const block=i=>{
    const c=ev[i]||{},first=!old;
    return '<div class="card" style="margin-top:14px"><h3 style="margin:0 0 4px;font-size:19px">Vehicle '+(i+1)+(i===0?'':' (optional)')+'</h3><p class="pkt" style="margin:0 0 12px">'+(i===0?'Fill this in to get started.':'Leave the name empty to skip this one.')+'</p>'
     +'<div class="flds"><label class="fld">Name<input type="text" id="s'+i+'_name" placeholder="Vehicle name" value="'+esc(c.name)+'"></label>'
     +'<label class="fld">Type<select id="s'+i+'_type"><option value="car"'+(c.type==='car'?' selected':'')+'>Car</option><option value="bike"'+(c.type==='bike'?' selected':'')+'>Bike or scooter</option></select></label>'
     +'<label class="fld">Registration (optional)<input type="text" id="s'+i+'_reg" value="'+esc(c.reg)+'"></label>'
     +'<label class="fld">Purchase date<input type="date" id="s'+i+'_date" value="'+esc(c.date)+'"></label>'
     +'<label class="fld">Purchase price (₹)<input type="number" inputmode="decimal" id="s'+i+'_price" value="'+esc(c.price)+'"></label>'
     +'<label class="fld">Odometer at purchase (km)<input type="number" inputmode="numeric" id="s'+i+'_km0" placeholder="0 if new" value="'+esc(c.km0)+'"></label>'
     +'<label class="fld">Service every (months)<input type="number" inputmode="numeric" id="s'+i+'_sm" value="'+esc(c.sm||12)+'"></label><label class="fld">Service every (km)<input type="number" inputmode="numeric" id="s'+i+'_sk" value="'+esc(c.sk||(c.type==='bike'?5000:10000))+'"></label><label class="fld">Tyre life (km)<input type="number" inputmode="numeric" id="s'+i+'_ty" value="'+esc(c.tyre||(c.type==='bike'?20000:50000))+'"></label>'
     +(first?'<label class="fld">Odometer today (km)<input type="number" inputmode="numeric" id="s'+i+'_km1" placeholder="Now"></label>'
     +'<label class="fld">Past fuel price (₹ a litre, optional)<input type="number" inputmode="decimal" id="s'+i+'_rate" placeholder="e.g. 100"></label>'
     +'<label class="fld">Past mileage (km a litre, optional)<input type="number" inputmode="decimal" id="s'+i+'_kmpl" placeholder="e.g. 15"></label>':'')
     +'</div><p class="pkt" style="margin:10px 0 0">Service and tyre figures start with typical values. Change them to match your owner’s manual or your mechanic.</p>'+(first?'<p class="pkt" style="margin:10px 0 0">The last two are optional. If you give both, the ledger estimates the fuel you used between purchase and today. Leave them empty to count only fuel you log yourself.</p>':'')+'</div>';
  };
  document.body.innerHTML='<div class="wrap" id="top"><header class="hero" style="padding-bottom:0"><h1>'+(old?'Change vehicle details.':'Set up your ledger.')+'</h1><p>Add your vehicles to start. Everything you enter stays on this device. Nothing is sent anywhere.</p></header>'
   +[0,1,2].map(block).join('')
   +(old?'':'<div class="card" style="margin-top:14px"><h3 style="margin:0 0 4px;font-size:19px">Already have a backup file?</h3><p class="pkt" style="margin:0 0 10px">Choose it to restore your vehicles and entries, for example on a new phone.</p><input type="file" accept=".json,application/json" id="s_file" style="font-size:16px;max-width:100%"><div class="btnrow" style="margin-top:10px"><button class="btn alt" id="s_restore">Restore from file</button></div></div>')
   +'<div class="btnrow" style="margin:20px 0 6px"><button class="btn" id="s_go">'+(old?'Save changes':'Start my ledger')+'</button>'+(old?'<button class="btn alt" id="s_cancel">Cancel</button>':'')+'<span class="fmsg" id="s_msg"></span></div></div>';
  const $=id=>document.getElementById(id);
  const bad=t=>{const m=$('s_msg');m.textContent=t;m.style.color='var(--red)'};
  [0,1,2].forEach(i=>{const t=$('s'+i+'_type');t.addEventListener('change',()=>{const car=t.value==='car',sk=$('s'+i+'_sk'),ty=$('s'+i+'_ty');if(['10000','5000'].includes(sk.value))sk.value=car?10000:5000;if(['50000','20000'].includes(ty.value))ty.value=car?50000:20000})});
  if($('s_cancel'))$('s_cancel').addEventListener('click',()=>{location.hash='';location.reload()});
  if($('s_restore'))$('s_restore').addEventListener('click',()=>{
    const f=$('s_file').files&&$('s_file').files[0];if(!f)return bad('Choose a backup file first.');
    const r=new FileReader();
    r.onload=()=>{try{
      const p=JSON.parse(r.result);
      if(!p||p.app!=='vehicle-ledger-family'||!p.cfg||!p.store)throw new Error('x');
      localStorage.setItem(CFG_KEY,JSON.stringify(p.cfg));localStorage.setItem('vehicleLedger.family.v1',JSON.stringify(p.store));
      location.hash='';location.reload();
    }catch(e){bad('That file isn’t a backup from this app.')}};
    r.readAsText(f);
  });
  $('s_go').addEventListener('click',()=>{
    const out=[];
    for(let i=0;i<3;i++){
      const name=$('s'+i+'_name').value.trim();
      if(!name){if(i===0)return bad('Give vehicle 1 a name.');continue}
      const date=$('s'+i+'_date').value,price=parseFloat($('s'+i+'_price').value),km0=parseFloat($('s'+i+'_km0').value)||0;
      if(!date)return bad('Pick the purchase date for '+name+'.');
      if(!(price>0))return bad('Enter the purchase price for '+name+'. A rough figure is fine.');
      const o=ev[i];
      const c={slot:SL[i],name:name.slice(0,30),type:$('s'+i+'_type').value,reg:$('s'+i+'_reg').value.trim().toUpperCase().slice(0,20),date,price,km0,sm:parseFloat($('s'+i+'_sm').value)||12,sk:parseFloat($('s'+i+'_sk').value)||10000,tyre:parseFloat($('s'+i+'_ty').value)||50000};
      if(o){c.km1=o.km1;c.d1=o.d1;c.rate=o.rate;c.kmpl=o.kmpl}
      else{
        const km1=parseFloat($('s'+i+'_km1').value)||km0;
        if(km1<km0)return bad('The odometer today for '+name+' is lower than at purchase.');
        c.km1=km1;c.d1=today>date?today:date;c.rate=parseFloat($('s'+i+'_rate').value)||0;c.kmpl=parseFloat($('s'+i+'_kmpl').value)||0;
      }
      out.push(c);
    }
    try{localStorage.setItem(CFG_KEY,JSON.stringify({v:1,vehicles:out}))}catch(e){return bad('This browser is blocking saved data. Open the file in Chrome, Safari or Edge normally, not in a private window.')}
    location.hash='';location.reload();
  });
}
const CATS={
  service:{n:'Routine service',c:'var(--green)'},
  engine:{n:'Engine & transmission',c:'var(--orange)'},
  susp:{n:'Suspension & steering',c:'var(--purple)'},
  brakes:{n:'Brakes',c:'var(--red)'},
  ac:{n:'Air conditioning',c:'var(--teal)'},
  body:{n:'Body & cosmetic',c:'var(--pink)'},
  clutch:{n:'Clutch & drive',c:'#2aa198'},
  labour:{n:'Labour & service charge',c:'var(--gray)'},
  other:{n:'Other',c:'#c7c7cc'},
  wash:{n:'Washing',c:'#5e5ce6'},
  battery:{n:'Battery',c:'#c8a400'},
  nobill:{n:'Paid, no bill',c:'#b08968'},
  acc:{n:'Accessories & fitting',c:'#e0a526'},
  chain:{n:'Chain & sprocket',c:'#4f7cac'},
  ins:{n:'Insurance',c:'#6f7fb8'},
  warr:{n:'Warranty & roadside',c:'#b5838d'},
  buy:{n:'Purchase price',c:'#6b8f71'},
  fuel:{n:'Fuel',c:'#e07a5f'},
  toll:{n:'Toll (FASTag)',c:'#3d8a9a'},
  puc:{n:'Pollution check (PUC)',c:'#7a9a3d'}
};


/* ================= VEHICLES, BUILT FROM YOUR SETUP ================= */
const SLOTS=['altis','ntorq','scr'],SLOTCOL={altis:'var(--blue)',ntorq:'var(--ntorq)',scr:'var(--scr)'};
const kv=rows=>'<dl class="kv">'+rows.map(r=>'<div><dt>'+r[0]+'</dt><dd>'+r[1]+'</dd></div>').join('')+'</dl>';
const kl=a=>'<ul class="kl">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const BF={};
const VEH={};
CFG.vehicles.forEach(c=>{
  const k=c.slot,price=+c.price||0,km0=+c.km0||0,km1=Math.max(+c.km1||0,km0);
  const B=price>0?[{d:c.date,noText:'Entered in setup',t:price,title:'Purchase',c:{buy:price},note:'The purchase price you entered when you set up this vehicle. Replace it with the exact figure if you like, in Change vehicle details.'}]:[];
  VEH[k]={key:k,name:c.name,type:c.type,reg:c.reg||'',acc:SLOTCOL[k],B:B,W:null,G:[],E:[],
    win:{from:c.date,to:c.d1||c.date,km0:km0,km1:km1,mstart:c.date,get startText(){return 'purchase ('+fmt(c.date)+', '+km0.toLocaleString('en-IN')+' km)'},get endText(){return this.km1.toLocaleString('en-IN')+' km on '+fmt(this.to)},excl:null,nopurchase:null},
    h1:'Every rupee your '+c.name+' has cost.',
    get intro(){return 'The purchase plus every fuel fill-up and expense you add, from '+fmt(c.date)+'.'},
    yearLede:'Spending by year. Tap a year to filter the entries below.',
    catLede:'Each expense by category.',
    get period(){const d=allBills(this).map(b=>b.d).sort();return d.length?MON[+d[0].slice(5,7)-1]+' '+d[0].slice(0,4)+' to '+MON[+d[d.length-1].slice(5,7)-1]+' '+d[d.length-1].slice(0,4):''},
    get count(){return allBills(this).length+' entries'},
    foot:'Amounts are what you entered. Cost per km counts every cost from purchase to your latest odometer reading.'};
  if(c.rate>0&&c.kmpl>0&&c.d1&&km1>km0)BF[k]={k0:km0,k1:km1,d0:c.date,d1:c.d1,rate:+c.rate,kmpl:+c.kmpl};
  else if(c.d1&&km1>km0)BF[k]={k0:km0,k1:km1,d0:c.date,d1:c.d1,rate:0,kmpl:1};
});
Object.keys(VEH).forEach(k=>VEH[k].B.forEach(b=>{b.veh=k}));

let YEARS=['2022','2023','2024','2025','2026'];

const STORE_KEY='vehicleLedger.family.v1';
const EMPTY=()=>({fuel:{altis:[],ntorq:[],scr:[]},exp:{altis:[],ntorq:[],scr:[]},odo:{},gone:[],opp:null,oppAt:0,qa:{},qx:[]});
function normalise(p){
  const s=EMPTY();if(!p||typeof p!=='object')return s;
  for(const k of ['altis','ntorq','scr']){s.fuel[k]=((p.fuel||{})[k]||[]).slice();s.exp[k]=((p.exp||{})[k]||[]).slice()}
  s.odo=Object.assign({},p.odo||{});
  Object.keys(s.odo).forEach(k=>{const o=s.odo[k];if(!o||!o.km){delete s.odo[k];return}if(!o.id)o.id='o'+o.d+'-'+o.km});
  s.gone=Array.isArray(p.gone)?p.gone.map(String):[];
  if(p.qa&&typeof p.qa==='object')Object.keys(p.qa).forEach(k=>{const o=p.qa[k];if(o&&typeof o==='object')s.qa[k]={a:o.a==null?null:String(o.a),at:+o.at||0}});
  if(Array.isArray(p.qx))s.qx=p.qx.filter(x=>x&&x.id&&x.q).map(x=>({id:String(x.id),v:x.v||'all',q:String(x.q),at:+x.at||0}));
  if(p.opp&&typeof p.opp==='object'){s.opp=p.opp;s.oppAt=+p.oppAt||1}
  if(p.set&&typeof p.set==='object'){s.set=p.set;s.setAt=+p.setAt||1}
  return s;
}
let STORE=EMPTY();
let storeOK=true;
try{const raw=localStorage.getItem(STORE_KEY);if(raw)STORE=normalise(JSON.parse(raw))}catch(e){storeOK=false}
function saveLocal(){try{localStorage.setItem(STORE_KEY,JSON.stringify(STORE));return true}catch(e){storeOK=false;return false}}
function saveStore(){const ok=saveLocal();scheduleBackup(1500);return ok}
const getFuel=v=>(STORE.fuel[v.key]||[]).map(f=>({id:f.id,d:f.d,km:f.km,l:f.l,t:f.amt||0,full:f.full!==false,p:f.p===true}));
function bfMonths(v){
  const b=BF[v.key];if(!b)return [];
  const T=d=>new Date(d+'T00:00:00').getTime();
  let pts=[{d:b.d0,km:b.k0}];
  v.B.filter(x=>x.km&&x.d>b.d0&&x.d<b.d1).sort((x,y)=>x.d.localeCompare(y.d)||x.km-y.km).forEach(x=>{const l=pts[pts.length-1];if(x.km>l.km&&x.km<b.k1&&x.d>l.d)pts.push({d:x.d,km:x.km})});
  pts.push({d:b.d1,km:b.k1});
  const kmAt=t=>{if(t<=T(pts[0].d))return pts[0].km;for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i];if(t<=T(c.d))return a.km+(c.km-a.km)*(t-T(a.d))/(T(c.d)-T(a.d))}return b.k1};
  const out=[];let y=+b.d0.slice(0,4),m=+b.d0.slice(5,7),prev=b.k0,pT=T(b.d0);
  for(;;){
    const nx=m===12?[y+1,1]:[y,m+1];
    const ns=nx[0]+'-'+String(nx[1]).padStart(2,'0')+'-01';
    const last=T(ns)>T(b.d1);
    const t=last?T(b.d1):T(ns);
    const km=last?b.k1:Math.round(kmAt(t));
    const mk=y+'-'+String(m).padStart(2,'0');
    const dd=last?b.d1:new Date(T(ns)-86400000).toISOString().slice(0,10);
    out.push({d:dd,month:mk,km:km-prev,l:(km-prev)/b.kmpl,t:Math.round((km-prev)/b.kmpl*b.rate),k0:prev,k1:km,title:'Fuel (estimated)'});
    prev=km;if(last)break;y=nx[0];m=nx[1];
  }
  const tot=Math.round((b.k1-b.k0)/b.kmpl*b.rate),diff=tot-out.reduce((a,x)=>a+x.t,0);out[out.length-1].t+=diff;
  return out;
}
function bfEst(v){const b=BF[v.key];if(!b||!(b.rate>0))return null;const km=b.k1-b.k0,l=km/b.kmpl;return Object.assign({km,l,t:Math.round(l*b.rate)},b)}
const fuelTotal=v=>getFuel(v).reduce((a,f)=>a+f.t,0)+(bfEst(v)||{t:0}).t;
const getExp=v=>(STORE.exp[v.key]||[]).map(e=>({id:e.id,d:e.d,t:e.t,title:e.title,c:{[e.cat]:e.t},km:e.km||undefined,note:e.note||'',noText:'Added by you'+(e.src==='claude'?', read by Claude':e.src==='free'?', read from a document':''),user:true,cat:e.cat}));

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function mileageSegs(list){
  const e=list.slice().sort((a,b)=>a.km-b.km||a.d.localeCompare(b.d));
  const segs=[];let base=null,lit=0,amt=0,np=0,nf=0;
  e.forEach(x=>{
    if(base===null){if(x.full){base=x.km;lit=0;amt=0;np=0;nf=0}return}
    lit+=x.l;amt+=x.t;nf++;if(x.p)np++;
    if(x.full){const dist=x.km-base;if(dist>0&&lit>0)segs.push({id:x.id,d:x.d,dist,l:lit,amt,kmpl:dist/lit,pt:np===0?'r':np===nf?'p':'m'});base=x.km;lit=0;amt=0;np=0;nf=0}
  });
  return segs;
}
function sinceFull(list){
  const e=list.slice().sort((a,b)=>a.km-b.km||a.d.localeCompare(b.d)),m={};let base=null;
  e.forEach(x=>{if(base!==null&&x.km>base)m[x.id]=x.km-base;if(x.full)base=x.km});
  return m;
}
function mileageStats(list){
  const s=mileageSegs(list);
  if(!s.length)return {n:0};
  const D=s.reduce((a,x)=>a+x.dist,0),L=s.reduce((a,x)=>a+x.l,0),A=s.reduce((a,x)=>a+x.amt,0);
  return {n:s.length,latest:s[s.length-1].kmpl,avg:D/L,best:Math.max(...s.map(x=>x.kmpl)),worst:Math.min(...s.map(x=>x.kmpl)),cpk:A/D,dist:D,segs:s};
}

const GROUPS={buy:'purchase',acc:'purchase',ins:'running',warr:'running',wash:'running',fuel:'running',toll:'running',puc:'running'};
const grpOf=k=>GROUPS[k]||'maint';
function costs(v,win,ignorePk){
  const g={purchase:0,running:0,maint:0,fuel:0};
  const ok=(d,pk)=>!win||(!ignorePk&&pk!==undefined?pk:(d>=win.from&&d<=win.to));
  allBills(v).forEach(b=>{if(!ok(b.d,b.pk))return;for(const k in b.c){g[grpOf(k)]+=b.c[k];if(k==='fuel')g.fuel+=b.c[k]}});
  (v.W||[]).forEach(w=>{if(ok(w.d,undefined))g.running+=w.t});
  getFuel(v).forEach(f=>{if(ok(f.d,undefined)){g.running+=f.t;g.fuel+=f.t}});
  const be=bfEst(v);if(be)bfMonths(v).forEach(m=>{if(ok(m.d,undefined)){g.running+=m.t;g.fuel+=m.t}})
  g.total=g.purchase+g.running+g.maint;return g;
}
const pkf=n=>!isFinite(n)?'—':'₹'+(n>=10?n.toFixed(1):n.toFixed(2));
const GCOL={purchase:'#6b8f71',maint:'var(--orange)',running:'#6f7fb8'};
function effWin(v){
  const w=Object.assign({},v.win);let moved=false;
  const reads=getFuel(v).map(f=>({d:f.d,km:f.km}));
  const o=STORE.odo[v.key];if(o)reads.push({d:o.d,km:o.km});
  getExp(v).forEach(e=>{if(e.km)reads.push({d:e.d,km:e.km})});
  reads.forEach(r=>{if(r.km>w.km1){w.km1=r.km;if(r.d>w.to)w.to=r.d;moved=true}else if(r.km===w.km1&&r.d>w.to){w.to=r.d;moved=true}});
  if(moved)w.endText=inr(w.km1)+' km on '+fmt(w.to);
  return w;
}
function winStats(v){
  const w=effWin(v),c=costs(v,w),km=w.km1-w.km0;
  const months=Math.max(1,(new Date(w.to+'T00:00:00')-new Date(w.mstart+'T00:00:00'))/86400000/30.44);
  return {w,c,km,months};
}
function groupSub(v){
  const c=costs(v);
  return [c.purchase>0?'₹'+inr(c.purchase)+' purchase and accessories':null,'₹'+inr(c.maint)+' maintenance','₹'+inr(c.running)+' running'].filter(Boolean).join(' + ');
}
function perKmSection(v){

  return '<section id="perkm"><h2>Cost per km</h2><p class="lede">Every cost from '+w.startText+' to '+w.endText+', divided by the '+inr(km)+' km covered.</p>'
   +'<div class="pkbig"><div class="big">'+pkf(c.total/km)+'<small>per km, all costs</small></div><div class="pkt" style="margin-top:8px">₹'+inr(c.total)+' over '+inr(km)+' km</div><div class="stack" style="margin-top:16px">'+stack+'</div></div>'
   +'<div class="pkgrid">'
   +card('purchase','Purchase cost','The bike and the extras bought with it. It falls with every km you ride.',c.purchase,v.win.nopurchase)

   +'</div>'

function trendPts(v){
  const w=effWin(v),T=d=>new Date(d+'T00:00:00').getTime();
  let pts=[{d:w.from,km:w.km0}];
  v.B.filter(x=>x.km&&x.d>w.from&&x.d<w.to).sort((a,b)=>a.d.localeCompare(b.d)||a.km-b.km).forEach(x=>{const l=pts[pts.length-1];if(x.km>l.km&&x.km<w.km1&&x.d>l.d)pts.push({d:x.d,km:x.km})});
  pts.push({d:w.to,km:w.km1});
  const kmAt=d=>{const t=T(d);if(t<=T(pts[0].d))return pts[0].km;for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i];if(t<=T(c.d))return a.km+(c.km-a.km)*(t-T(a.d))/Math.max(1,T(c.d)-T(a.d))}return w.km1};
  const y0=+w.from.slice(0,4),y1=+w.to.slice(0,4),rows=[];
  for(let y=y0;y<=y1;y++){
    const a=y===y0?w.from:y+'-01-01',b=y===y1?w.to:y+'-12-31';
    const km=Math.round(kmAt(b)-kmAt(a));
    const cum=costs(v,{from:'1900-01-01',to:b},true),yr=costs(v,{from:a,to:b},true);
    const kc=kmAt(b)-w.km0,own=yr.maint+yr.running;
    rows.push({y,part:y===y1||y===y0,km,own,ownPk:km>=800?own/km:null,cumPk:kc>=800?cum.total/kc:null,cumTotal:cum.total});
  }
  return rows.filter(r=>r.cumTotal>0);
}
function lineChart(rows,key,color,title){
  const P=rows.filter(r=>r[key]!=null);
  if(P.length<2)return '';
  const W=340,H=150,l=44,r=14,t=14,b=24,mx=Math.max(...P.map(p=>p[key]))*1.12,mn=0;
  const X=i=>l+(W-l-r)*(P.length===1?0:i/(P.length-1)),Y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  const f=n=>n>=10?n.toFixed(0):n.toFixed(1);
  let g='';for(let i=0;i<=3;i++){const v=mx*i/3;g+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line,#8883)" stroke-width="1"/><text x="'+(l-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" fill="var(--ink3)">₹'+f(v)+'</text>'}
  const d=P.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[key]).toFixed(1)).join(' ');
  const dots=P.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(p[key])+'" r="3.5" fill="'+color+'"/><text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">'+(p.part&&i===P.length-1?"'"+String(p.y).slice(2)+'*':"'"+String(p.y).slice(2))+'</text>').join('');
  const last=P[P.length-1],first=P[0];
  return '<div class="card" style="margin-top:12px"><b>'+title+'</b><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+title+'" style="margin-top:6px">'+g+'<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round"/>'+dots
    +'<text x="'+X(P.length-1)+'" y="'+(Y(last[key])-9)+'" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">'+pkf(last[key])+'</text></svg></div>';
}
function perKmTrend(v){
  const rows=trendPts(v);
  const cum=rows.filter(r=>r.cumPk!=null),own=rows.filter(r=>r.ownPk!=null);
  if(cum.length<2&&own.length<2)return '';
  const chg=(a,b)=>{const p=(b-a)/a*100;return (p<=0?'down ':'up ')+Math.abs(Math.round(p))+'%'};
  let say='';
  if(cum.length>1)say+='All-in cost per km has gone from '+pkf(cum[0].cumPk)+' (end of '+cum[0].y+') to '+pkf(cum[cum.length-1].cumPk)+' now, '+chg(cum[0].cumPk,cum[cum.length-1].cumPk)+', as the purchase price spreads over more km. ';
  if(own.length>1){const a=own[own.length-2],b=own[own.length-1];say+='Leaving out the purchase, '+(b.part?'the latest part year ('+b.y+')':b.y)+' is '+pkf(b.ownPk)+' a km against '+pkf(a.ownPk)+' in '+a.y+', '+chg(a.ownPk,b.ownPk)+'.'}
  const tr=rows.map(r=>'<tr><td>'+r.y+(r.part?'*':'')+'</td><td>'+inr(r.km)+'</td><td>'+(r.ownPk!=null?pkf(r.ownPk):'—')+'</td><td>'+(r.cumPk!=null?pkf(r.cumPk):'—')+'</td></tr>').join('');
  return '<div style="margin-top:20px"><h3 style="font-size:19px;letter-spacing:-.02em;margin:0 0 4px">Trend over the years</h3><p class="pkt" style="margin:0">'+say+'</p></div>'
    +lineChart(rows,'cumPk','#6f7fb8','All-in cost per km, building up year by year')
    +lineChart(rows,'ownPk','var(--orange)','Each year’s own cost per km, without the purchase')
    +'<div class="card ptab" style="margin-top:12px"><table><thead><tr><th>Year</th><th>Km</th><th>Own ₹/km</th><th>All-in ₹/km</th></tr></thead><tbody>'+tr+'</tbody></table></div>'
    +'<p class="fn">* Part year. Km in each year come from the odometer on your bills and fills, spread evenly between readings. Years under 800 km are left out of the lines. Own cost is maintenance plus running (fuel, insurance, toll, washing) for that year. Insurance and big repairs land in the year they were paid, so single years can jump.</p>';
}

function premiumCard(v){
  const L=getFuel(v).filter(f=>f.l>0&&f.t>0),P=L.filter(f=>f.p),R=L.filter(f=>!f.p);
  if(!P.length)return '';
  const sum=(a,k)=>a.reduce((x,y)=>x+y[k],0),pl=sum(P,'l'),pt=sum(P,'t'),pr=pt/pl;
  let extra='',kp='';
  if(R.length){
    const rr=sum(R,'t')/sum(R,'l'),ex=pt-pl*rr;
    extra='<p class="pkt" style="margin:6px 0 0">Regular petrol cost you ₹'+rr.toFixed(2)+' a litre. Premium cost ₹'+pr.toFixed(2)+', so about ₹'+inr(Math.round(ex))+' more over '+pl.toFixed(1)+' litres (₹'+(pr-rr).toFixed(0)+' a litre).</p>';
  }else extra='<p class="pkt" style="margin:6px 0 0">Log a regular fill-up as well and this will show what premium costs you over regular.</p>';
  const m=mileageStats(getFuel(v)),sg=m.segs||[],sp=sg.filter(x=>x.pt==='p'),sr=sg.filter(x=>x.pt==='r');
  const km=a=>a.reduce((x,y)=>x+y.dist,0)/a.reduce((x,y)=>x+y.l,0);
  if(sp.length&&sr.length){const a=km(sp),b=km(sr),d=(a/b-1)*100;
    kp='<p class="pkt" style="margin:6px 0 0">Mileage: premium '+a.toFixed(1)+' km per litre ('+sp.length+' tank'+(sp.length>1?'s':'')+'), regular '+b.toFixed(1)+' ('+sr.length+' tank'+(sr.length>1?'s':'')+'). '+(Math.abs(d)<3?'No real difference yet.':'Premium is '+Math.abs(d).toFixed(0)+'% '+(d>0?'better':'worse')+'.')+(sp.length+sr.length<6?' Too few tanks to be sure.':'')+'</p>';
  }else kp='<p class="pkt" style="margin:6px 0 0">Mileage comparison appears once you have full-tank readings on both premium and regular.</p>';
  return '<div class="card" style="margin-top:12px"><b>Premium petrol</b>'+extra+kp+'</div>';
}
function fuelReport(v){
  const list=getFuel(v),m=mileageStats(list);
  const f1=n=>n.toFixed(1);
  const stats=[[m.n?f1(m.latest):'—','km per litre, latest'],[m.n?f1(m.avg):'—','km per litre, average'],[m.n?'₹'+m.cpk.toFixed(2):'—','fuel cost per km']];
  const sf=sinceFull(list);

const REGS={};Object.values(VEH).forEach(v=>{if(v.reg)REGS[v.reg.replace(/\s+/g,'')]=v.key});
const MONI={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const pad2=n=>String(n).padStart(2,'0');
const isoOf=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2015||y>2035)return null;return y+'-'+pad2(m)+'-'+pad2(d)};
function findDates(s){
  const out=[];let m;
  const r1=/(?<!\d)(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})(?!\d)/g;
  while((m=r1.exec(s))){const x=isoOf(m[3],m[2],m[1]);if(x)out.push(x)}
  const r2=/(?<!\d)(\d{1,2})(?:st|nd|rd|th)?[ \t\-]*([A-Za-z]{3})[a-z]*\.?[ \t\-,]*(\d{4}|\d{2})(?!\d)/g;
  while((m=r2.exec(s))){const mo=MONI[m[2].toLowerCase()];if(mo){const x=isoOf(m[3],mo,m[1]);if(x)out.push(x)}}
  return out;
}
const toNum=s=>{const n=parseFloat(String(s).replace(/[₹,\s]/g,''));return isNaN(n)?null:n};
const cap=(t,re)=>{const m=re.exec(t);return m?m[1]:null};
const regVeh=t=>{for(const r in REGS){if(t.indexOf(r)>=0)return REGS[r]}return null};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
function gstTotal(t){
  const toks=(t.match(/\d[\d,]*\.\d{2}|(?<![\d.])\d{3,6}(?![\d.])/g)||[]).map(toNum).filter(x=>x&&x>=50);
  let best=null;
  toks.forEach(a=>toks.forEach(x=>{if(x>a&&Math.abs(a*1.18-x)<=1.01&&(best===null||x>best))best=x}));
  return best;
}
function wordsToNum(s){
  if(!s)return null;
  const U={ZERO:0,ONE:1,TWO:2,THREE:3,FOUR:4,FIVE:5,SIX:6,SEVEN:7,EIGHT:8,NINE:9,TEN:10,ELEVEN:11,TWELVE:12,THIRTEEN:13,FOURTEEN:14,FIFTEEN:15,SIXTEEN:16,SEVENTEEN:17,EIGHTEEN:18,NINETEEN:19,TWENTY:20,THIRTY:30,FORTY:40,FIFTY:50,SIXTY:60,SEVENTY:70,EIGHTY:80,NINETY:90};
  let total=0,cur=0;
  for(const w of s.toUpperCase().split(/\s+/).filter(Boolean)){
    if(w in U)cur+=U[w];
    else if(w==='HUNDRED')cur*=100;
    else if(w==='THOUSAND'){total+=cur*1000;cur=0}
    else if(w==='LAKH'||w==='LAKHS'){total+=cur*100000;cur=0}
    else if(w==='AND')continue;
    else return null;
  }
  return total+cur||null;
}
function periodStart(t){
  const ds=[...new Set(findDates(t))].sort();
  let best=null;
  for(const s of ds)for(const e of ds){const n=dayDiff(s,e);if(n>=360&&n<=367&&(!best||s>best.s))best={s,e}}
  return best?{s:best.s,e:best.e,all:ds}:{s:null,e:null,all:ds};
}

function loadPdfJs(){

    sc.onerror=()=>rej(new Error('load'));document.head.appendChild(sc)});
  PDFJS=import(CDN+'4.0.379/pdf.min.mjs').then(m=>{m.GlobalWorkerOptions.workerSrc=CDN+'4.0.379/pdf.worker.min.mjs';return m}).catch(umd).catch(e=>{PDFJS=null;throw new Error('load')});

async function pdfText(file){
  const lib=await loadPdfJs();const buf=await file.arrayBuffer();
  const doc=await lib.getDocument({data:new Uint8Array(buf),isEvalSupported:false}).promise;
  const out=[];
  for(let p=1;p<=Math.min(doc.numPages,6);p++){
    const pg=await doc.getPage(p),tc=await pg.getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<=3);if(!r){r={y,it:[]};rows.push(r)}r.it.push({x,s:it.str.trim()})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.it.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ')));
  }
  return out.join('\n');
}

const getSet=()=>Object.assign({bud:{},lf:[]},STORE.set||{});
function putSet(patch){STORE.set=Object.assign(getSet(),patch);STORE.setAt=Date.now();return saveStore()}
const GSTRE=/\b\d{2}[A-Z]{5}\d{4}[A-Z][0-9A-Z]Z[0-9A-Z]\b/;
function docSig(t){
  const g=(t.toUpperCase().match(GSTRE)||[])[0]||'';
  const h=(t.split('\n').map(x=>x.replace(/[^A-Za-z& ]/g,' ').replace(/\s+/g,' ').trim()).find(x=>x.replace(/[^A-Za-z]/g,'').length>=5&&!/^(TAX )?INVOICE|^BILL|^RECEIPT|^ORIGINAL|^DUPLICATE|^PAGE/i.test(x))||'').toUpperCase().slice(0,40);
  return {g,h};
}
const sigSame=(a,b)=>(a.g&&b.g)?a.g===b.g:(!!a.h&&a.h===b.h);
const lfNote=()=>{const n=getSet().lf.length;return n?'I’ve learned '+n+' bill format'+(n>1?'s':'')+' from you: '+getSet().lf.map(f=>f.name).slice(0,6).join(', ')+(n>6?' and more':'')+'.':'PDFs from garages and insurers read best, because the text is already inside them. When I don’t know a format, fill in the details once and I’ll learn it.'};
function numHits(ln){const out=[],re=/\d[\d,]*(?:\.\d{1,2})?/g;let m;while((m=re.exec(ln)))out.push({i:m.index,len:m[0].length,n:toNum(m[0])});return out}
function dateHits(ln){const out=[],re=/\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}|\d{1,2}(?:st|nd|rd|th)?[ \-]*[A-Za-z]{3}[a-z]*\.?[ \-,]*\d{2,4}/g;let m;while((m=re.exec(ln)))out.push({i:m.index,len:m[0].length,d:findDates(m[0])[0]});return out}
function labelAt(ln,i,len){
  const bef=ln.slice(0,i).replace(/(Rs\.?|INR|₹|[:\-=]|\s)+$/i,'');
  const m=/([A-Za-z][A-Za-z.#\/]*(?:\s+[A-Za-z][A-Za-z.#\/]*){0,3})$/.exec(bef);
  if(m&&m[1].replace(/[^A-Za-z]/g,'').length>=2)return {lab:m[1].trim(),after:false};
  const a=/^\s*([A-Za-z]{2,12})/.exec(ln.slice(i+len));
  return a?{lab:a[1],after:true}:null;
}
function anchorOf(t,val,kind){
  if(val==null||val==='')return null;
  const cands=[];
  t.split('\n').forEach(ln=>{
    const hits=kind==='d'?dateHits(ln).filter(h=>h.d===val):numHits(ln).filter(h=>h.n!=null&&Math.abs(h.n-val)<=(kind==='t'?1:0));
    hits.forEach(h=>{const a=labelAt(ln,h.i,h.len);if(a)cands.push(a)});
  });
  if(!cands.length)return null;
  if(kind==='t'){const pr=cands.filter(a=>/total|payable|net|amount|grand|premium/i.test(a.lab));return pr.length?pr[pr.length-1]:cands[cands.length-1]}
  if(kind==='km'){const pr=cands.filter(a=>/km|odo|reading|kms/i.test(a.lab));return pr[0]||cands[0]}
  const pr=cands.filter(a=>/date|dt|dated/i.test(a.lab));return pr[0]||cands[0];
}
function byAnchor(t,a,kind){
  if(!a)return null;
  const esc=a.lab.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
  const lines=t.split('\n');
  for(let k=lines.length-1,i0=0;i0<lines.length;i0++){
    const i=kind==='t'?lines.length-1-i0:i0,ln=lines[i];
    if(a.after){const m=new RegExp('(\\d[\\d,]*(?:\\.\\d{1,2})?)\\s*'+esc+'\\b','i').exec(ln);if(m)return toNum(m[1]);continue}
    const re=new RegExp(esc,'i'),m=re.exec(ln);if(!m)continue;
    const rest=ln.slice(m.index+m[0].length);
    if(kind==='d'){const d=findDates(rest)[0];if(d)return d;continue}
    const n=/^[^\d\n]{0,25}?(\d[\d,]*(?:\.\d{1,2})?)/.exec(rest);if(n)return toNum(n[1]);
  }
  return null;
}
const titleCase=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
function learnFormat(t,x){
  const sig=docSig(t);if(!sig.g&&!sig.h)return null;
  const a={t:anchorOf(t,x.t,'t'),d:anchorOf(t,x.d,'d'),km:x.km?anchorOf(t,x.km,'km'):null};
  if(!a.t&&!a.d)return null;
  const S=getSet(),lf=S.lf.filter(f=>!sigSame(f,sig));
  const old=S.lf.find(f=>sigSame(f,sig));
  const f={g:sig.g,h:sig.h,name:old?old.name:(titleCase(sig.h)||'this shop'),veh:x.veh,cat:x.cat,title:x.title,a,n:(old?old.n:0)+1,at:Date.now()};
  lf.unshift(f);putSet({lf:lf.slice(0,40)});
  return f;
}
function readLearned(t){
  const sig=docSig(t),f=getSet().lf.find(x=>sigSame(x,sig));if(!f)return null;
  const tt=byAnchor(t,f.a.t,'t'),d=byAnchor(t,f.a.d,'d'),km=byAnchor(t,f.a.km,'km');
  return {label:'a format you taught me ('+f.name+', '+f.n+' bill'+(f.n>1?'s':'')+')',veh:regVeh(t)||f.veh,d,t:tt,title:f.title,cat:f.cat,km:km&&km>100?km:null,no:null,note:'',learned:f};
}
function guessDoc(t){
  const ds=findDates(t).filter(d=>d>='2015-01-01'&&d<=todayStr()).sort();
  let tot=null;t.split('\n').forEach(ln=>{if(/total|payable|grand|net amount/i.test(ln)){const h=numHits(ln).filter(x=>x.n>=50);if(h.length)tot=h[h.length-1].n}});
  const km=toNum(cap(t,/(?:KMS?|Odometer|KM Reading)\D{0,12}(\d[\d,]{2,9})/i));
  return {d:ds[ds.length-1]||null,t:tot,km,veh:regVeh(t)};
}
function readDoc(raw){
  const t=raw.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ');
  for(const p of PARSERS){try{const r=p(t);if(r)return r}catch(e){}}
  return null;
}
function dupOf(vk,d,t,no){
  const v=VEH[vk];if(!v)return null;
  return allBills(v).find(b=>(d&&b.d===d&&Math.abs(b.t-t)<1.5)||(no&&b.noText&&b.noText.indexOf(no)>=0&&Math.abs(b.t-t)<1.5))||null;
}
function expForm(v){
  const opts=CAT_ORDER.map(k=>'<option value="'+k+'">'+CATS[k].n+'</option>').join('');
  const vopts=Object.values(VEH).map(x=>'<option value="'+x.key+'"'+(x.key===v.key?' selected':'')+'>'+x.name+'</option>').join('');
  return '<section id="add"><h2>Add an expense</h2><p class="lede">Type it in, or choose a PDF or paste text from a bill.</p>'
   +'<div class="card"><b style="font-size:17px">Read a bill</b>'
   +'<p class="pkt" style="margin:6px 0 12px">Choose a PDF, or paste the text from an invoice, policy or receipt. The first time you add a bill from a shop, fill in the details yourself and I learn how that shop’s bill is laid out, so the next one fills in by itself.</p>'
   +'<textarea class="bk" id="d_txt" rows="4" placeholder="Paste text here"></textarea>'
   +'<div class="btnrow"><button class="btn" id="d_read">Read it</button><label class="btn alt" for="d_pdf" style="display:inline-block">Choose a PDF</label><input type="file" id="d_pdf" accept="application/pdf,.pdf" hidden><span class="fmsg" id="d_msg"></span></div>'
   +'<p class="pkt" style="margin:10px 0 0" id="d_lf">'+lfNote()+'</p>'
   +'<div id="d_unk" class="caveat" hidden style="margin-top:12px"><p style="margin:0">I don’t recognise this format yet. Fill in the details below and tap Save expense, and I’ll learn it, so the next bill from the same place fills in by itself.</p></div></div>'
   +'<div class="card" id="xform" style="margin-top:12px"><b style="font-size:17px">Expense details</b><div class="flds" style="margin-top:12px">'
   +'<label class="fld">Vehicle<select id="x_v">'+vopts+'</select></label>'
   +'<label class="fld">Date<input type="date" id="x_d" value="'+todayStr()+'"></label>'
   +'<label class="fld">Amount (₹)<input type="number" inputmode="decimal" step="0.01" id="x_t"></label>'
   +'<label class="fld">Odometer (km), if known<input type="number" inputmode="numeric" id="x_km"></label></div>'
   +'<label class="fld" style="margin-top:12px">What was it<input type="text" id="x_title" placeholder="e.g. Service and brake pads"></label>'
   +'<label class="fld" style="margin-top:12px">Category<select id="x_c">'+opts+'</select></label>'
   +'<label class="fld" style="margin-top:12px">Note (optional)<input type="text" id="x_n"></label>'
   +'<div class="btnrow" style="margin-top:14px"><button class="btn" id="x_save">Save expense</button><span class="fmsg" id="x_msg"></span></div></div></section>';
}
function initAdd(v){
  const $=id=>document.getElementById(id);
  let src='typed',dupAsked=false,pending=null,lastDoc=null;
  const say=(id,t,bad)=>{const e=$(id);if(e){e.textContent=t;e.style.color=bad?'var(--red)':'var(--green)'}};
  function fillDraft(r,how){
    if(r.veh&&VEH[r.veh])$('x_v').value=r.veh;
    $('x_d').value=r.d||'';
    $('x_t').value=r.t!=null?r.t:'';
    $('x_km').value=r.km||'';
    $('x_title').value=r.title||'';
    if(r.cat&&CATS[r.cat])$('x_c').value=r.cat;
    $('x_n').value=(r.note||'').trim();
    src=how;dupAsked=false;
    const miss=[];if(!r.d)miss.push('the date');if(r.t==null)miss.push('the amount');
    let m=(how==='claude'?'Read by Claude':'Recognised: '+r.label)+'. Check the details below, then tap Save expense.'+(r.learned?' If anything is wrong, correct it before saving and I’ll update what I learned.':'');
    if(miss.length)m+=' I couldn’t find '+miss.join(' or ')+'.';
    const dup=(r.d&&r.t!=null)?dupOf($('x_v').value,r.d,r.t,r.no):null;
    if(dup)m+=' This looks like “'+dup.title+'” which you already have.';
    say('d_msg',m,!!(miss.length||dup));
    $('xform').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
  }
  function readNow(){
    $('d_unk').hidden=true;if($('d_conf'))$('d_conf').hidden=true;lastDoc=null;
    const txt=$('d_txt').value.trim();
    if(!txt)return say('d_msg','Paste some text first.',true);
    const r=readDoc(txt);
    if(r){fillDraft(r,'free');return}
    const l=readLearned(txt);
    lastDoc=txt;
    if(l){fillDraft(l,'free');return}
    say('d_msg','',false);$('d_unk').hidden=false;
    const g=guessDoc(txt);
    if(g.d)$('x_d').value=g.d;if(g.t!=null)$('x_t').value=g.t;if(g.km)$('x_km').value=g.km;if(g.veh&&VEH[g.veh])$('x_v').value=g.veh;
  }
  $('d_read').addEventListener('click',readNow);
  $('d_pdf').addEventListener('change',async()=>{
    const f=$('d_pdf').files&&$('d_pdf').files[0];if(!f)return;
    say('d_msg','Reading the PDF…',false);$('d_msg').style.color='var(--ink2)';
    try{
      const t=await pdfText(f);
      if(!t||t.replace(/\s/g,'').length<20){say('d_msg','This PDF is a scanned picture with no text inside. Use a photo with Claude below, or type it in.',true);return}
      $('d_txt').value=t;readNow();
    }catch(e){say('d_msg',e&&e.message==='load'?'Couldn’t load the PDF reader. Check your internet connection and try again.':'Couldn’t read this PDF. Copy its text and paste it above instead.',true)}
    finally{$('d_pdf').value=''}
  });
  $('x_save').addEventListener('click',()=>{
    const vk=$('x_v').value,d=$('x_d').value,t=parseFloat($('x_t').value),km=parseFloat($('x_km').value)||null,cat=$('x_c').value;
    let title=$('x_title').value.trim();
    if(!d)return say('x_msg','Pick a date.',true);
    if(!(t>0))return say('x_msg','Enter the amount.',true);
    if(!title)title=CATS[cat].n;
    const editing=EDIT&&EDIT.k==='x';
    const dup=editing?null:dupOf(vk,d,t,null);
    if(dup&&!dupAsked){dupAsked=true;return say('x_msg','This matches “'+dup.title+'” on '+fmt(dup.d)+'. Tap Save again to add it anyway.',true)}
    let oldSrc=null;
    if(editing){const ov=EDIT.vk;const old=(STORE.exp[ov]||[]).find(e=>String(e.id)===String(EDIT.id));if(old)oldSrc=old.src;STORE.gone.push(String(EDIT.id));STORE.exp[ov]=(STORE.exp[ov]||[]).filter(e=>String(e.id)!==String(EDIT.id))}
    EDIT=null;
    STORE.exp[vk]=STORE.exp[vk]||[];
    STORE.exp[vk].push({id:Date.now()+Math.floor(Math.random()*1000),d,t:Math.round(t*100)/100,title:title.slice(0,80),cat,km:km?Math.round(km):null,note:$('x_n').value.trim().slice(0,200),src:editing&&oldSrc?oldSrc:src});
    let learnt='';
    if(lastDoc&&!editing){const f=learnFormat(lastDoc,{veh:vk,d,t,km,cat,title});if(f)learnt=' I’ve learned the '+f.name+' format, so the next bill like it fills in by itself.'}
    lastDoc=null;
    flash('x_msg',saveStore()?(editing?'Changes saved.':'Saved to the '+VEH[vk].name+'. It now counts in the reports.')+learnt:'Could not save on this device.');
    refresh();
  });
}

const BK={state:'off',at:null,msg:'',ref:null,pushing:false,dirty:false,timer:null,force:false,lastSig:null,lastManual:0};
try{BK.lastManual=+localStorage.getItem('vehicleLedger.lastBackup')||0}catch(e){}
const storeSig=s=>{const a=[];for(const k of ['altis','ntorq','scr']){['fuel','exp'].forEach(p=>(s[p][k]||[]).forEach(e=>a.push(p+k+e.id+(e.km||'')+(e.t||e.amt||''))));const o=s.odo[k];if(o)a.push('o'+k+o.id+o.km)}a.sort();return a.join('|')+'#'+[...new Set((s.gone||[]).map(String))].sort().join(',')+(s.oppAt?'@'+s.oppAt:'')+(s.setAt?'$'+s.setAt:'')+(Object.keys(s.qa||{}).length||(s.qx||[]).length?'&'+Object.keys(s.qa||{}).sort().map(k=>k+':'+s.qa[k].at).join(',')+'/'+(s.qx||[]).map(x=>x.id).sort().join(','):'')};
const hasData=s=>storeSig(Object.assign(EMPTY(),s,{gone:[]}))!=='#';
function mergeStores(a,b){
  const gone=new Set([...(a.gone||[]),...(b.gone||[])].map(String));
  const out=EMPTY();out.gone=[...gone];
  Object.keys(Object.assign({},a.qa,b.qa)).forEach(k=>{const x=(a.qa||{})[k],y=(b.qa||{})[k];out.qa[k]=!x?y:!y?x:(x.at>=y.at?x:y)});
  const qm=new Map();[...(a.qx||[]),...(b.qx||[])].forEach(x=>{if(!gone.has(x.id))qm.set(x.id,x)});out.qx=[...qm.values()];
  const oa=(a.oppAt||0)>=(b.oppAt||0)?a:b;if(oa.opp){out.opp=oa.opp;out.oppAt=oa.oppAt||1}
  const sa=(a.setAt||0)>=(b.setAt||0)?a:b;if(sa.set){out.set=sa.set;out.setAt=sa.setAt||1}
  for(const k of ['altis','ntorq','scr']){
    for(const part of ['fuel','exp']){
      const m=new Map();
      [...(a[part][k]||[]),...(b[part][k]||[])].forEach(e=>{if(!gone.has(String(e.id)))m.set(String(e.id),e)});
      out[part][k]=[...m.values()];
    }
    const c=[a.odo[k],b.odo[k]].filter(o=>o&&!gone.has(String(o.id))).sort((x,y)=>y.km-x.km||String(y.d).localeCompare(String(x.d)));
    if(c.length)out.odo[k]=c[0];
  }
  return out;
}

/* ---------- cumulative chart ---------- */
function heroChart(ev,TOTAL){
  const CW=800,H=260,pl=8,pr=8,pt=16,pb=30;
  ev=ev.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const pts=[];let run=0;
  ev.forEach(b=>{run+=b.t;pts.push({t:new Date(b.d+'T00:00:00').getTime(),y:run,b})});
  const t0=pts[0].t-86400000*20,t1=pts[pts.length-1].t+86400000*20;
  const X=t=>pl+(t-t0)/(t1-t0)*(CW-pl-pr);
  const Y=v=>H-pb-(v/TOTAL)*(H-pb-pt);
  let d='M'+X(t0)+' '+Y(0),prevY=0;
  pts.forEach(p=>{d+=' L'+X(p.t)+' '+Y(prevY)+' L'+X(p.t)+' '+Y(p.y);prevY=p.y});
  d+=' L'+X(t1)+' '+Y(TOTAL);
  const area=d+' L'+X(t1)+' '+Y(0)+' Z';
  let s='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".28"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>';
  [0.25,0.5,0.75,1].forEach(f=>{const y=Y(TOTAL*f);s+='<line x1="'+pl+'" x2="'+(CW-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'});
  s+='<path d="'+area+'" fill="url(#g)"/>';
  s+='<path id="ln" d="'+d+'" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
  const y0=new Date(t0).getFullYear(),y1=new Date(t1).getFullYear();
  for(let yr=y0+1;yr<=y1;yr++){const x=X(new Date(yr+'-01-01').getTime());s+='<text x="'+x+'" y="'+(H-8)+'" fill="var(--ink3)" font-size="12" text-anchor="middle">'+yr+'</text>'}
  s+='<text x="'+pl+'" y="'+(H-8)+'" fill="var(--ink3)" font-size="12">'+y0+'</text>';
  s+='<circle id="dot" r="6" fill="var(--acc)" stroke="var(--card)" stroke-width="3" cx="'+X(pts[pts.length-1].t)+'" cy="'+Y(TOTAL)+'"/>';
  s+='<rect id="hit" x="0" y="0" width="'+CW+'" height="'+H+'" fill="transparent" style="cursor:crosshair;touch-action:pan-y"/>';
  const svg=document.getElementById('hero');svg.innerHTML=s;
  const ln=document.getElementById('ln');
  if(!reduce&&!NOANIM){const L=ln.getTotalLength();ln.style.strokeDasharray=L;ln.style.strokeDashoffset=L;ln.getBoundingClientRect();ln.style.transition='stroke-dashoffset 1.6s cubic-bezier(.3,.7,.2,1)';requestAnimationFrame(()=>{ln.style.strokeDashoffset=0})}
  const tip=document.getElementById('tip'),dot=document.getElementById('dot');
  function move(e){
    const r=svg.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX);
    const vx=(cx-r.left)/r.width*CW;let best=pts[0];
    pts.forEach(p=>{if(Math.abs(X(p.t)-vx)<Math.abs(X(best.t)-vx))best=p});
    dot.setAttribute('cx',X(best.t));dot.setAttribute('cy',Y(best.y));
    const k=r.width/CW;
    tip.style.left=Math.max(70,Math.min(r.width-70,X(best.t)*k))+'px';
    tip.style.top=(Y(best.y)*k)+'px';
    tip.innerHTML='<b>₹'+inr(best.y)+'</b><span>'+(best.b.dt||fmt(best.b.d))+' · '+best.b.title+'</span>';
    tip.style.opacity=1;
  }
  const hit=document.getElementById('hit');
  hit.addEventListener('mousemove',move);hit.addEventListener('touchstart',move,{passive:true});hit.addEventListener('touchmove',move,{passive:true});
  hit.addEventListener('mouseleave',()=>{tip.style.opacity=0});
  hit.addEventListener('touchend',()=>{setTimeout(()=>{tip.style.opacity=0},1400)});
}
const eventsOf=(v,prefix)=>allBills(v).map(b=>({d:b.d,dt:b.dateText,t:b.t,title:(prefix?v.name+' · ':'')+b.title}))

/* ---------- years ---------- */
function yearsBlock(series,stacked){
  const ysum={};YEARS.forEach(y=>{ysum[y]=0});
  const per=series.map(s=>{const o={};YEARS.forEach(y=>{o[y]=0});s.items.forEach(b=>{o[b.d.slice(0,4)]+=b.t});YEARS.forEach(y=>{ysum[y]+=o[y]});return o});
  const ymax=Math.max(...YEARS.map(y=>ysum[y]));
  const yEl=document.getElementById('years');
  if(stacked)yEl.parentNode.classList.add('stk');
  yEl.classList.toggle('dense',YEARS.length>6);
  yEl.style.gridTemplateColumns='repeat('+YEARS.length+',1fr)';
  yEl.innerHTML=YEARS.map(y=>{
    const tot=ysum[y];
    const inner=stacked?series.map((s,i)=>'<i style="height:'+(tot?per[i][y]/tot*100:0)+'%;background:'+s.color+'"></i>').join(''):'';
    return '<button class="yr" data-y="'+y+'" aria-label="'+y+', ₹'+inr(tot)+'"><div class="v">₹'+(tot===0?'0':tot>=100000?(tot/100000).toFixed(2)+'L':tot>=10000?(tot/1000).toFixed(0)+'k':(tot/1000).toFixed(1)+'k')+'</div><div class="bw"><div class="b" data-h="'+(tot/ymax*100)+'">'+inner+'</div></div><div class="y">'+y+(y==='2026'?'*':'')+'</div></button>';
  }).join('');
  requestAnimationFrame(()=>{setTimeout(()=>{yEl.querySelectorAll('.b').forEach(b=>{b.style.height=b.dataset.h+'%'})},reduce?0:300)});
  yEl.querySelectorAll('.yr').forEach(b=>b.addEventListener('click',()=>{setFilter(b.dataset.y);document.getElementById('seg').scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}));
}

function catsBlock(v,TOTAL){
  const csum={};allBills(v).forEach(b=>{for(const k in b.c)csum[k]=(csum[k]||0)+b.c[k]});
  if(v.W)csum.wash=washTotal(v);
  const fsum=fuelTotal(v);if(fsum>0)csum.fuel=(csum.fuel||0)+fsum;
  const order=Object.keys(csum).sort((a,b)=>csum[b]-csum[a]);
  const cEl=document.getElementById('cats'),cmax=csum[order[0]];
  cEl.innerHTML=order.map(k=>{
    const p=csum[k]/TOTAL*100;
    return '<div class="cat"><div class="nm"><span class="dot" style="background:'+CATS[k].c+'"></span>'+CATS[k].n+'</div><div class="am">₹'+inr(csum[k])+'</div><div class="tr"><i data-w="'+(csum[k]/cmax*100)+'" style="background:'+CATS[k].c+'"></i></div><div class="pc">'+(p<1?'Under 1':p.toFixed(0)+'%')+' of all spending</div></div>';
  }).join('');
  if(ioCats)ioCats.disconnect();

  ioCats.observe(cEl);
}

/* ---------- repeated work ---------- */
function repeatsBlock(v){
  const G=v.G,B=v.B;
  const T0=new Date(B[0].d+'T00:00:00').getTime(),T1=new Date(B[B.length-1].d+'T00:00:00').getTime();
  const pos=s=>((new Date(s+'T00:00:00').getTime()-T0)/(T1-T0)*100);
  const avoidable=G.filter(g=>g.v==='often').reduce((a,g)=>a+g.avoidAmt,0);
  const optional=G.filter(g=>g.v==='optional').reduce((a,g)=>a+g.total,0);
  const redo=G.filter(g=>g.v==='redo').reduce((a,g)=>a+g.redo,0);
  const cards=[['Likely avoidable',avoidable,'var(--orange)','Jobs done far more often than usual'],
   ['Repeat repairs',redo,'var(--red)','Second go at the same fix'],
   ['Optional extras',optional,'var(--blue)','Not part of a scheduled service']];
  document.getElementById('sum3').innerHTML=cards.map(a=>'<div class="stat"><i style="background:'+a[2]+'"></i><div class="n">'+(a[1]>0?'₹'+inr(a[1]):'None')+'</div><div class="l">'+a[0]+'. '+a[3]+'.</div></div>').join('');
  const rseg=document.getElementById('rseg'),rlist=document.getElementById('rlist');
  const RF=[['look','Needs a look'],['ok','On schedule'],['all','All']];
  const y0=new Date(T0).getFullYear(),y1=new Date(T1).getFullYear();
  let yl='';for(let y=y0+1;y<=y1;y++)yl+='<span style="left:'+pos(y+'-01-01')+'%">'+y+'</span>';
  function rRender(){
    rseg.innerHTML=RF.map(f=>'<button aria-pressed="'+(state.rf===f[0])+'" data-f="'+f[0]+'">'+f[1]+'</button>').join('');
    rseg.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{state.rf=b.dataset.f;rRender()}));
    const items=G.filter(g=>state.rf==='all'||(state.rf==='look'?['often','redo','optional','ask'].includes(g.v):['ok','info'].includes(g.v)))
      .sort((a,b)=>VT[a.v].o-VT[b.v].o||b.total-a.total);
    rlist.innerHTML=items.map(g=>{
      const dots=g.occ.map(o=>'<i style="left:'+pos(B[o[0]].d)+'%"></i>').join('');
      let extra='';
      if(g.v==='often'&&g.avoidAmt>0)extra=' <b>Likely avoidable: ₹'+inr(g.avoidAmt)+'.</b>';
      if(g.v==='redo'&&g.redo>0)extra=' <b>Second job: ₹'+inr(g.redo)+'.</b>';
      if(g.v==='optional')extra=' <b>Optional: ₹'+inr(g.total)+'.</b>';
      const sub=g.n+'× · ₹'+inr(g.total)+(g.occ.some(o=>o[1]==null)?' + unpriced':'');
      return '<div class="rp" style="--vc:'+VT[g.v].c+'"><div class="rp-h"><div><b>'+g.name+'</b><small>'+sub+'</small></div><span class="pill">'+(g.pill||VT[g.v].l)+'</span></div><div class="strip">'+dots+'</div><div class="yrs"><span style="visibility:hidden">.</span>'+yl+'</div><p class="say">'+g.say+'</p><p class="guide">'+g.guide+extra+'</p></div>';
    }).join('');
  }
  rRender();
}

const mainCat=b=>{let m=-1,r;for(const k in b.c){if(b.c[k]>m&&k!=='labour'){m=b.c[k];r=k}}return r||'labour'};

function billItems(keys){
  const out=[];
  keys.forEach(k=>{const v=VEH[k];v.B.forEach((b,i)=>out.push({b,i,k,d:b.d}));getExp(v).forEach(b=>out.push({b,i:null,k,d:b.d,user:true}));v.E.forEach((e,i)=>out.push({e,i,k,d:e.d}))});
  out.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);

}

function hayOf(o){
  const v=VEH[o.k],x=o.b||o.e||{};

  const cats=x.c?Object.keys(x.c).map(c=>(CATS[c]||{}).n+' '+x.c[c]+' '+inr(x.c[c])).join(' '):'';

function runSearch(){
  const q=document.getElementById('q'),res=document.getElementById('qres'),n=document.getElementById('qn');
  if(!q)return;
  const terms=q.value.toLowerCase().replace(/₹/g,' ').replace(/(\d),(?=\d)/g,'$1').split(/\s+/).filter(Boolean);
  if(!terms.length){res.hidden=true;res.innerHTML='';n.textContent='Looks through every bill and payment: names, items, notes, amounts, bill numbers, months and years.';return}
  const hits=billItems(Object.keys(VEH)).filter(o=>{const h=hayOf(o).replace(/(\d),(?=\d)/g,'$1');const w=h.split(/[^a-z0-9]+/);return terms.every(t=>/^\d+$/.test(t)?w.includes(t):h.includes(t))});
  const sum=hits.reduce((a,o)=>a+((o.b?o.b.t:0)),0);
  n.textContent=hits.length?hits.length+' found, ₹'+inr(sum)+' in all':'Nothing found. Try fewer or shorter words.';
  res.hidden=false;
  renderRows(res,hits,true,'s','No matches.');
}

/* ================= HOME: QUICK FUEL + NEEDS DOING ================= */
const QF={veh:null};
function qfVeh(){
  if(QF.veh&&VEH[QF.veh])return VEH[QF.veh];
  let best=null;Object.values(VEH).forEach(v=>getFuel(v).forEach(f=>{if(!best||f.d>best.d)best={d:f.d,k:v.key}}));
  QF.veh=best?best.k:Object.keys(VEH)[0];return VEH[QF.veh];
}
function qfPrem(v){const f=getFuel(v).filter(x=>x.t>0&&x.l>0).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.km-a.km)[0];return !!(f&&f.p)}
function qfRate(v,p){
  if(p===undefined)p=qfPrem(v);
  const f=getFuel(v).filter(x=>x.t>0&&x.l>0&&!!x.p===p).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.km-a.km)[0];
  if(f)return Math.round(f.t/f.l*100)/100;
  const o=getFuel(v).filter(x=>x.t>0&&x.l>0).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.km-a.km)[0];
  return o?Math.round(o.t/o.l*100)/100:((BF[v.key]||{}).rate||'');
}

/* ================= MONTHLY BUDGET ================= */
function monthSpend(v,mk){
  let s=0;const now=todayStr();
  allBills(v).forEach(b=>{if(!b.d||b.d.slice(0,7)!==mk||b.d>now)return;s+=(b.t||0)-((b.c||{}).buy||0)});
  (v.W||[]).concat(getFuel(v),bfMonths(v)).forEach(x=>{if(x.d&&x.d.slice(0,7)===mk&&x.d<=now)s+=x.t||0});
  return s;
}

/* ================= WHAT IF (opportunity cost) ================= */
const RET_SRC={2019:13.5,2020:16.1,2021:25.6,2022:5.7,2023:21.3,2024:10.1};
const OPP_DEF={ret:Object.assign({},RET_SRC,{2025:7,2026:7}),pt:2,cab:22.7,bike:10.3,inf:4,resale:{altis:0,ntorq:0,scr:0}};
const getOpp=()=>{const o=STORE.opp||{};return {ret:Object.assign({},OPP_DEF.ret,o.ret||{}),pt:o.pt!=null?o.pt:OPP_DEF.pt,cab:o.cab!=null?o.cab:OPP_DEF.cab,bike:o.bike!=null?o.bike:OPP_DEF.bike,inf:o.inf!=null?o.inf:OPP_DEF.inf,resale:Object.assign({},OPP_DEF.resale,o.resale||{})}};
function setOpp(patch){const o=getOpp();STORE.opp=Object.assign(o,patch);STORE.oppAt=Date.now();saveStore()}
const DAY=86400000,T0=d=>new Date(d+'T00:00:00').getTime();
/* growth of 1 rupee from date d to now, using each calendar year's return for the part of the year it was invested */
function growth(d,ret,now){
  let t=T0(d),f=1;if(t>=now)return 1;
  while(t<now){
    const y=new Date(t).getFullYear(),end=Math.min(now,new Date(y+1,0,1).getTime()),len=new Date(y+1,0,1).getTime()-new Date(y,0,1).getTime();
    const r=(ret[y]!=null?ret[y]:7)/100;f*=Math.pow(1+r,(end-t)/len);t=end;
  }
  return f;
}
function oppCalc(v,o){
  const now=Date.now();
  const out=allBills(v).concat(v.W||[],getFuel(v),bfMonths(v)).filter(x=>x.d&&x.t>0&&T0(x.d)<=now);
  const spent=out.reduce((a,x)=>a+x.t,0);
  const fv=out.reduce((a,x)=>a+x.t*growth(x.d,o.ret,now),0);
  const w=effWin(v),months=bfMonths(v);
  const km=months.reduce((a,m)=>a+m.km,0)||Math.max(0,w.km1-w.km0);
  const uRate=v.type==='car'?o.cab:o.bike;
  const fare=(r,m)=>r/Math.pow(1+o.inf/100,Math.max(0,(now-T0(m.d))/(365.25*DAY)));
  const alt=r=>({nom:months.reduce((a,m)=>a+m.km*fare(r,m),0),fv:months.reduce((a,m)=>a+m.km*fare(r,m)*growth(m.d,o.ret,now),0)});
  const resale=+o.resale[v.key]||0;
  return {v,spent,fv,lost:fv-spent,km,resale,netNow:spent-resale,ownFv:fv-resale,pt:alt(o.pt),ub:alt(uRate),uRate,flat:{pt:km*o.pt,ub:km*uRate}};
}
const cr=n=>'₹'+inr(n);
function oppCard(c,o){
  const v=c.v,uName=v.type==='car'?'Uber or Ola cab':'Uber Moto or bike taxi';
  const verdict=(own,alt,lbl)=>{const d=alt-own;return d>=0?'Owning cost <b>'+cr(d)+' less</b> than '+lbl:'Owning cost <b>'+cr(-d)+' more</b> than '+lbl};
  const rows=[['Spent so far',cr(c.spent)],['Resale value (your estimate)','− '+cr(c.resale)],['<b>Net cost of owning</b>','<b>'+cr(c.netNow)+'</b>'],['Same money, invested instead',cr(c.fv)+' today'],['Lost investment returns','<b>'+cr(c.lost)+'</b>'],['<b>Cost of owning, with lost returns</b>','<b>'+cr(c.ownFv)+'</b>']];
  return '<div class="card" style="margin-bottom:14px"><h3 style="margin:0 0 4px;display:flex;gap:8px;align-items:center"><i class="dot" style="background:'+v.acc+';width:10px;height:10px;border-radius:50%;display:inline-block"></i>'+v.name+'</h3>'
   +'<p class="pkt" style="margin:0 0 10px">'+inr(c.km)+' km covered.'+(c.km>0?' Owning, net of resale, works out at '+pkf(c.netNow/c.km)+' per km, or '+pkf(c.ownFv/c.km)+' with lost returns.':'')+'</p>'
   +kv(rows)
   +'<h4 style="margin:18px 0 6px;font-size:15px">The same km without the '+v.name+'</h4>'
   +kv([['By public transport, fares of the day',cr(c.pt.nom)],['By '+uName+', fares of the day',cr(c.ub.nom)],['Public transport, in today’s money',cr(c.pt.fv)],[uName+', in today’s money',cr(c.ub.fv)]])
   +'<p class="pkt" style="margin:12px 0 0">'+verdict(c.ownFv,c.pt.fv,'public transport')+'. '+verdict(c.ownFv,c.ub.fv,'Uber')+'. Both sides are in today’s money.</p></div>';
}
function oppResults(){
  const o=getOpp();const cs=Object.values(VEH).map(v=>oppCalc(v,o));
  const T=k=>cs.reduce((a,c)=>a+c[k],0);
  const tot={lost:T('lost'),netNow:T('netNow'),ownFv:T('ownFv'),pt:cs.reduce((a,c)=>a+c.pt.fv,0),ub:cs.reduce((a,c)=>a+c.ub.fv,0)};
  const stat=(n,l)=>'<div class="stat"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>';
  const head='<div class="stats" style="margin-top:0;grid-template-columns:1fr">'+stat(cr(tot.lost),'lost investment returns, all vehicles')+stat(cr(tot.netNow),'net cost after resale')+stat(cr(tot.ownFv),'total cost, with lost returns')+'</div>';
  const cmp='<div class="card ptab" style="margin:14px 0"><table><thead><tr><th></th><th>Owning</th><th>Public transport</th><th>Uber</th></tr></thead><tbody>'
   +cs.map(c=>'<tr><td><span class="vtag" style="--vc:'+c.v.acc+'"><i></i>'+c.v.name+'</span></td><td>'+cr(c.ownFv)+'</td><td>'+cr(c.pt.fv)+'</td><td>'+cr(c.ub.fv)+'</td></tr>').join('')
   +'<tr><td><b>All vehicles</b></td><td><b>'+cr(tot.ownFv)+'</b></td><td><b>'+cr(tot.pt)+'</b></td><td><b>'+cr(tot.ub)+'</b></td></tr></tbody></table></div>'
   +'<p class="fn">All in today’s money. Owning is what you spent, minus resale, plus what that money would have earned. Public transport and Uber use each month’s km at that month’s fare, with the same market returns applied to the fare you would have saved.</p>';
  return head+cmp+cs.map(c=>oppCard(c,o)).join('');
}
function monthKm(v){
  const b=BF[v.key];if(!b)return [];
  const T=d=>new Date(d+'T00:00:00').getTime();
  let pts=[{d:b.d0,km:b.k0}];
  v.B.filter(x=>x.km&&x.d>b.d0&&x.d<b.d1).sort((x,y)=>x.d.localeCompare(y.d)||x.km-y.km).forEach(x=>{const l=pts[pts.length-1];if(x.km>l.km&&x.km<b.k1&&x.d>l.d)pts.push({d:x.d,km:x.km})});
  pts.push({d:b.d1,km:b.k1});
  const more=getFuel(v).filter(f=>f.km).map(f=>({d:f.d,km:f.km}));
  const o=(STORE.odo||{})[v.key];if(o&&o.km)more.push({d:o.d,km:o.km});
  getExp(v).filter(e=>e.km).forEach(e=>more.push({d:e.d,km:e.km}));
  more.filter(x=>x.d>b.d1).sort((x,y)=>x.d.localeCompare(y.d)||x.km-y.km).forEach(x=>{const l=pts[pts.length-1];if(x.km>l.km&&x.d>l.d)pts.push(x)});
  const e=pts[pts.length-1];
  const kmAt=t=>{if(t<=T(pts[0].d))return pts[0].km;for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i];if(t<=T(c.d))return a.km+(c.km-a.km)*(t-T(a.d))/(T(c.d)-T(a.d))}return e.km};

const IV={};Object.values(VEH).forEach(v=>{const c=CFG.vehicles.find(x=>x.slot===v.key)||{},car=v.type==='car';IV[v.key]={sm:+c.sm||12,sk:+c.sk||(car?10000:5000),puc:0,tyre:+c.tyre||(car?50000:20000)}});
const INS_END={};
const dPad=n=>String(n).padStart(2,'0');
const dAdd=(s,m)=>{const d=new Date(s+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getFullYear()+'-'+dPad(d.getMonth()+1)+'-'+dPad(d.getDate())};
const dFmt=s=>{const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0]};
const dMon=s=>{const p=s.split('-');return MON[+p[1]-1]+' '+p[0]};

function mileageAlert(v){
  const m=mileageStats(getFuel(v));if(!m.n)return null;

  if(prev.length<3)return null;
  const usual=prev[Math.floor(prev.length/2)];
  return {last,usual,n:prev.length,drop:(usual-last.kmpl)/usual};
}
function intelFor(v){
  const t=todayStr(),cfg=IV[v.key],odo=odoNow(v),bills=allBills(v).filter(b=>b.d&&b.c&&!b.pk);
  const cat=(c,min)=>bills.filter(b=>(b.c[c]||0)>(min||0)).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  const last=a=>a[a.length-1];
  const attn=[],soon=[];let renew=0;
  const km=n=>inr(Math.round(n/100)*100);
  /* service */
  const sv=last(cat('service',499).filter(b=>!b.approx));
  if(sv){
    const mo=dDiff(sv.d,t)/30.44,ks=sv.km?odo-sv.km:null,due=dAdd(sv.d,cfg.sm);
    const ratio=Math.max(mo/cfg.sm,ks!=null?ks/cfg.sk:0);

    if(ratio>=1)attn.push({v,amt:sv.t,date:t,sev:ratio>=1.25?'bad':'warn',title:v.name+' service '+(ratio>=1.25?'is overdue':'is due'),text:base+(ks!=null?'About '+km(ks)+' km and ':'')+Math.round(mo)+' months since then. Your usual gap is '+cfg.sm+' months or '+inr(cfg.sk)+' km.',why:'Based on your last real service bill and the latest odometer',pill:ratio>=1.25?'Overdue':'Due'});
    else soon.push({v,amt:sv.t,date:due,title:v.name+' next service',text:base+'Next by '+dFmt(due)+(sv.km?' or '+inr(sv.km+cfg.sk)+' km, whichever comes first.':'.'),pill:dMon(due)});
  }
  /* insurance */

  else{
    const end=INS_END[li.d]||dAdd(li.d,12),dl=dDiff(t,end);
    if(dl<0)attn.push({v,sev:'bad',title:v.name+' has no insurance on record since '+dFmt(end),text:'Your last policy on file ran to '+dFmt(end)+'. Nothing is recorded after that. If it was renewed, add it in the Add tab. If not, the vehicle is uninsured.',why:'Based on the policy dated '+dFmt(li.d),pill:'Check now'});
    else if(dl<=45)attn.push({v,amt:li.t,date:end,sev:'warn',title:v.name+' insurance renewal is close',text:'Cover runs to '+dFmt(end)+'. Last premium ₹'+inr(li.t)+'.',why:'Based on the policy dated '+dFmt(li.d),pill:'In '+dl+' days'});
    else soon.push({v,amt:li.t,date:end,title:v.name+' insurance renewal',text:'Last premium ₹'+inr(li.t)+'. Cover runs to '+dFmt(end)+'.',pill:dMon(end)});
    if(dl>=0&&dl<=365)renew+=li.t;
  }
  /* pollution certificate */
