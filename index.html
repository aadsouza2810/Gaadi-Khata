  if(pc){let nx=dAdd(pc.d,6);while(nx<t)nx=dAdd(nx,6);soon.push({v,amt:cfg.puc,date:nx,title:v.name+' pollution certificate',text:'Every 6 months. Last on file '+dMon(pc.d)+(pc.approx?' (estimated)':'')+'.',pill:dMon(nx)});}
  /* tyres */
  const ty=last(bills.filter(b=>/tyre|tire/i.test(b.title||'')).sort((a,b)=>a.d<b.d?-1:1));
  const noChg=false;
  if(ty){const ks=ty.km?odo-ty.km:null;if(ks!=null&&ks>=cfg.tyre&&noChg)attn.push({v,sev:'bad',title:v.name+' tyres are about '+km(ks)+' km old',text:'You confirmed they have not been changed since '+dMon(ty.d)+' (at '+inr(ty.km)+' km). A typical tyre life is about '+inr(cfg.tyre)+' km, so these are well past it. Plan a replacement.',why:'Based on your answer in the Questions tab',pill:'Replace soon'});else if(ks!=null&&ks>=cfg.tyre)attn.push({v,sev:'warn',title:'No newer '+v.name+' tyre bill',text:'The last tyre entry is '+dFmt(ty.d)+(ty.approx?' (an estimate)':'')+' at '+inr(ty.km)+' km. That is about '+km(ks)+' km ago, past a typical tyre life of about '+inr(cfg.tyre)+' km. If you changed them since, add the bill.',why:'Based on tyre entries and the latest odometer',pill:'Missing?'})}
  else if(odo>=12000)attn.push({v,sev:'warn',title:'No '+v.name+' tyre bill on record',text:'Nothing in the ledger mentions tyres, and you are at about '+km(odo)+' km. Add the bill if you have changed them.',why:'Based on all entries and the latest odometer',pill:'Check'});
  /* battery */
  const bt=last(cat('battery',699));
  if(bt){const due=dAdd(bt.d,42),dl=dDiff(t,due);
    if(dl<0)attn.push({v,sev:'warn',title:v.name+' battery is ageing',text:'Last changed '+dMon(bt.d)+'. Batteries here last about 3 to 4 years.',why:'Based on the battery entry',pill:'Check'});
    else if(dl<=450)soon.push({v,amt:bt.t,date:due,title:v.name+' battery',text:'Last changed '+dMon(bt.d)+'. Batteries here last about 3 to 4 years.',pill:dMon(due)});}
  /* repeat costs */
  const cy=+t.slice(0,4),fy=+(bills.map(b=>b.d).sort()[0]||t).slice(0,4);
  const ys=[];for(let y=Math.max(fy,cy-6);y<=cy-1;y++)ys.push(y);
  let best=null;
  if(ys.length>=3)[['susp','Suspension and steering'],['brakes','Brakes']].forEach(([c,nmx])=>{
    const per=ys.map(y=>bills.filter(b=>b.d.slice(0,4)==y).reduce((a,b)=>a+(b.c[c]||0),0));
    const hit=per.filter(x=>x>0).length,tot=per.reduce((a,b)=>a+b,0),avg=tot/ys.length;

  });
  if(best)attn.push({v,sev:'warn',title:best.nm+' keeps coming back on the '+v.name,text:'Spent in '+best.hit+' of the last '+best.n+' years, about ₹'+inr(best.avg)+' a year on average and ₹'+inr(best.max)+' in the worst year. Keep about ₹'+inr(Math.round(best.avg/500)*500)+' aside each year.',why:'Based on '+best.n+' years of entries',pill:'Pattern'});
  /* mileage */
  const ma=mileageAlert(v);
  if(ma&&ma.drop>=0.15)attn.push({v,sev:ma.drop>=0.25?'bad':'warn',title:v.name+' mileage dropped '+Math.round(ma.drop*100)+'%',text:'The latest full tank ('+dFmt(ma.last.d)+') gave '+ma.last.kmpl.toFixed(1)+' km per litre, against your usual '+ma.usual.toFixed(1)+'. Check the tyre pressure first, then for a dragging brake or a dirty air filter. Heavy traffic can cause one bad tank, so see whether the next one is back to normal.',why:'Based on your previous '+ma.n+' full tanks',pill:'Check'});
  /* forecast */
  const d0=+((BF[v.key]||{}).d0||t).slice(0,4),yrs=[];for(let y=cy-3;y<=cy-1;y++)if(y>=d0)yrs.push(y);
  const X={buy:1,acc:1,fuel:1,toll:1,wash:1,ins:1,puc:1};

  const ren=renew+2*(pc?pc.t:0);
  return {v,attn,soon,rep,ren,yrs,unins:attn.some(a=>/insurance on record/.test(a.title))};
}

function cpkVeh(v,o){
  const now=todayStr(),kmBy={},run={},cat={},big={},paid={};let pool=0,totKm=0;
  monthKm(v).forEach(m=>{const k=Math.max(0,m.km);kmBy[m.month]=(kmBy[m.month]||0)+k;totKm+=k});
  const add=(d,amt,c,title)=>{if(!d||!(amt>0)||d>now)return;const mk=d.slice(0,7);run[mk]=(run[mk]||0)+amt;const cm=cat[mk]=cat[mk]||{};cm[c]=(cm[c]||0)+amt;if(title&&(!big[mk]||amt>big[mk].t))big[mk]={t:amt,title:title}};
  allBills(v).forEach(b=>{
    if(!b.d||b.d>now)return;const c=b.c||{};
    pool+=(c.buy||0)+(c.acc||0);
    if((c.buy||0)+(c.acc||0)>0)paid[b.d.slice(0,7)]=(paid[b.d.slice(0,7)]||0)+(c.buy||0)+(c.acc||0);
    const ks=Object.keys(c).filter(k=>k!=='buy'&&k!=='acc');
    if(!Object.keys(c).length){add(b.d,b.t,'other',b.title);return}
    const r=ks.reduce((a,k)=>a+(c[k]||0),0);
    ks.forEach(k=>add(b.d,c[k],k));
    if(r>0){const mk=b.d.slice(0,7);if(!big[mk]||r>big[mk].t)big[mk]={t:r,title:b.title}}
  });
  (v.W||[]).forEach(w=>add(w.d,w.t,'wash'));
  getFuel(v).forEach(f=>add(f.d,f.t,'fuel'));
  bfMonths(v).forEach(m=>add(m.d,m.t,'fuel'));
  const resale=+o.resale[v.key]||0,net=Math.max(0,pool-resale),rate=totKm?net/totKm:0;
  return {v,kmBy,run,cat,big,paid,pool,resale,net,rate,totKm};
}
function cpkAll(){const o=getOpp();return Object.values(VEH).map(v=>cpkVeh(v,o))}
function cpkRows(D,keyFn,basis){
  const R={};
  D.forEach(x=>{
    const ms=new Set(Object.keys(x.kmBy).concat(Object.keys(x.run)).concat(basis==='paid'?Object.keys(x.paid):[]));
    ms.forEach(m=>{const k=keyFn(m);const r=R[k]=R[k]||{km:0,run:0,own:0,cat:{},big:null};
      const km=x.kmBy[m]||0;r.km+=km;r.run+=x.run[m]||0;r.own+=basis==='paid'?(x.paid[m]||0):km*x.rate;
      Object.entries(x.cat[m]||{}).forEach(([c,a])=>r.cat[c]=(r.cat[c]||0)+a);
      const b=x.big[m];if(b&&(!r.big||b.t>r.big.t))r.big={t:b.t,title:b.title,veh:x.v.name}});
  });
  return R;
}
const cpkMonthsBack=n=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
function cpkWindow(D,from,to){const R=cpkRows(D,m=>(m>=from&&m<=to)?'w':'x');return R.w||{km:0,run:0,own:0,cat:{}}}
function cpkInsights(D){
  const cur=cpkMonthsBack(0),a1=cpkMonthsBack(12),a2=cpkMonthsBack(1),b1=cpkMonthsBack(24),b2=cpkMonthsBack(13);
  const L=cpkWindow(D,a1,a2),P=cpkWindow(D,b1,b2),out=[];
  const pk=r=>r.km?(r.run+r.own)/r.km:0,rk=r=>r.km?r.run/r.km:0;
  if(L.km){
    const now=pk(L),was=pk(P);let t='Over the last 12 full months, everything together cost <b>'+pkf(now)+' a km</b>: '+pkf(rk(L))+' running and '+pkf(L.own/L.km)+' purchase.';
    if(was){const ch=(now-was)/was*100;t+=' That is <b class="'+(ch>0?'cpk-up':'cpk-dn')+'">'+(ch>0?'up ':'down ')+Math.abs(ch).toFixed(0)+'%</b> on the 12 months before ('+pkf(was)+').'}
    out.push(t);
    out.push('At that pace you spend about <b>'+cr((L.run+L.own)/12)+' a month</b>, or '+cr(L.run+L.own)+' a year, for about '+inr(L.km/12)+' km a month. Running alone is '+cr(L.run/12)+' a month.');
    const cs=Object.entries(L.cat).sort((x,y)=>y[1]-x[1]);
    if(cs.length&&L.run){const [c,a]=cs[0];const nm=(CATS[c]||{n:c}).n;let t2='<b>'+nm+'</b> is the biggest running cost, '+Math.round(a/L.run*100)+'% of it';if(cs[1])t2+=', then '+((CATS[cs[1][0]]||{n:cs[1][0]}).n).toLowerCase()+' at '+Math.round(cs[1][1]/L.run*100)+'%';out.push(t2+'.')}
  }
  if(D.length>1){
    const per=D.map(x=>{const r=cpkWindow([x],a1,a2);return {n:x.v.name,km:r.km,c:r.km?(r.run+r.own)/r.km:0}}).filter(x=>x.km>200).sort((x,y)=>x.c-y.c);
    if(per.length>1)out.push('Cheapest to use per km: <b>'+per[0].n+'</b> at '+pkf(per[0].c)+'. Most expensive: <b>'+per[per.length-1].n+'</b> at '+pkf(per[per.length-1].c)+' (last 12 months, everything included).');
  }
  const hi=D.filter(x=>x.rate>0).sort((x,y)=>y.rate-x.rate)[0];
  if(hi){const yk=cpkWindow([hi],a1,a2).km;if(yk>0){const nx=hi.net/(hi.totKm+yk);out.push('The '+hi.v.name+' purchase share is '+pkf(hi.rate)+' a km now. Every km you ride spreads it thinner: another year at your pace ('+inr(yk)+' km) takes it to about <b>'+pkf(nx)+'</b>, if the resale value holds.')}}
  const y=cur.slice(0,4),mo=+cur.slice(5,7)-1;
  if(mo>=2){const R=cpkRows(D,m=>m.slice(0,4)===y&&m<cur?'y':'x').y;if(R&&R.km){const f=12/mo;out.push(y+' so far: '+cr(R.run+R.own)+' over '+inr(R.km)+' km in '+mo+' full months. At this rate the full year comes to about <b>'+cr((R.run+R.own)*f)+'</b>.')}}
  return out.length?'<div class="cpk-ins">'+out.map(t=>'<div>'+t+'</div>').join('')+'</div>':'';
}
function cpkNewCar(D){
  const n=ncGet(),altis=D.find(x=>x.v.key==='altis');
  const fld=(id,l,v,st)=>'<label class="fld">'+l+'<input type="number" inputmode="decimal" id="nc_'+id+'" step="'+st+'" value="'+v+'"></label>';
  return '<h3 style="margin:26px 0 4px;font-size:19px">If you bought a new car</h3><p class="pkt" style="margin:0 0 10px">Example numbers to start with, not yours. Change them to the car you are considering. They are kept on this device.</p>'
   +'<div class="card"><div class="flds">'+fld('price','Price on road (₹)',n.price,'10000')+fld('res','Resale when you sell (%)',n.res,'1')+fld('yrs','Years you would keep it',n.yrs,'1')+fld('km','Km a year',n.km,'500')+fld('fuel','Fuel (₹ a km)',n.fuel,'0.1')+fld('run','Insurance and service (₹ a year)',n.run,'1000')+'</div><div id="nc_out"></div></div><div id="kr_out"></div>';
}
function cpkNewCarCalc(D){
  const g=id=>{const x=parseFloat((document.getElementById('nc_'+id)||{}).value);return isFinite(x)&&x>=0?x:0};
  const n={price:g('price'),res:g('res'),yrs:g('yrs')||1,km:g('km'),fuel:g('fuel'),run:g('run')};ncSet(n);
  const el=document.getElementById('nc_out');if(!el)return;
  if(!n.km){el.innerHTML='';return}
  const buy=n.price*(1-n.res/100)/n.yrs/n.km,runk=n.fuel+n.run/n.km,tot=buy+runk;
  const a=D.find(x=>x.v.type==='car')||D.find(x=>x.v.key==='altis'),w=a?cpkWindow([a],cpkMonthsBack(12),cpkMonthsBack(1)):null,ak=w&&w.km?(w.run+w.own)/w.km:0;
  let cmp='';
  if(ak){const d=tot-ak,yr=d*n.km;cmp='<div class="cpk-res" style="border-top:0;margin-top:2px;padding-top:0"><span>Your '+a.v.name+', last 12 months: '+pkf(ak)+' a km</span><span class="'+(d>0?'cpk-up':'cpk-dn')+'" style="font-weight:600;white-space:nowrap">'+(d>0?'+':'−')+pkf(Math.abs(d))+' a km</span></div>'
    +'<p class="pkt" style="margin:8px 0 0">At '+inr(n.km)+' km a year the new car would cost <b>'+cr(Math.abs(yr))+' a year '+(d>0?'more':'less')+'</b> than the '+a.v.name+' does now'+(d>0?', mostly because of the purchase share ('+pkf(buy)+' a km against the '+a.v.name+'’s '+pkf(a.rate)+').':'.')+'</p>'}
  const kr=document.getElementById('kr_out');if(kr)kr.innerHTML=keepReplace(D,tot,n);
  el.innerHTML='<div class="cpk-res"><span>New car, everything included</span><b>'+pkf(tot)+' a km</b></div>'
    +'<div class="cpk-res" style="border-top:0;margin-top:2px;padding-top:0;font-size:14px;color:var(--ink2)"><span>Purchase '+pkf(buy)+' · running '+pkf(runk)+'</span><span>'+cr(tot*n.km/12)+' a month</span></div>'+cmp;
}
const KR_DROP=12;
function keepReplace(D,newPk,n){
  const x=D.find(z=>z.v.type==='car')||D.find(z=>z.v.key==='altis');if(!x)return '';
  const v=x.v,REP=k=>!/^(fuel|wash|ins|puc|toll|warr)$/.test(k);
  const yr={};Object.keys(x.kmBy).forEach(m=>{const y=m.slice(0,4);(yr[y]=yr[y]||{km:0,rep:0}).km+=x.kmBy[m]});
  Object.entries(x.cat).forEach(([m,c])=>{const y=m.slice(0,4);yr[y]=yr[y]||{km:0,rep:0};Object.entries(c).forEach(([k,a])=>{if(REP(k))yr[y].rep+=a})});
  const cy=todayStr().slice(0,4),full=Object.keys(yr).filter(y=>(y<cy&&yr[y].km>500)||(y===cy&&yr[y].km>3000)).sort().slice(-5);
  if(full.length<2||!full.some(y=>yr[y].rep>0))return '';
  const pts=full.map((y,i)=>({i,y,r:yr[y].rep/yr[y].km}));
  const mx=pts.reduce((a,p)=>a+p.i,0)/pts.length,my=pts.reduce((a,p)=>a+p.r,0)/pts.length;
  const sl=pts.length>=3?pts.reduce((a,p)=>a+(p.i-mx)*(p.r-my),0)/pts.reduce((a,p)=>a+(p.i-mx)**2,0):0;
  const nxt=pts[pts.length-1].y===cy?pts.length:pts.length+1;const proj=Math.max(0,my+sl*(nxt-mx));
  const w=cpkWindow([x],cpkMonthsBack(12),cpkMonthsBack(1));if(!w.km)return '';
  const fuel=(w.cat.fuel||0)/w.km,oth=['wash','ins','puc','toll','warr'].reduce((a,k)=>a+(w.cat[k]||0),0)/w.km,dep=x.resale*KR_DROP/100/w.km;
  const R=(getOpp().ret[cy]!=null?getOpp().ret[cy]:7)/100,capK=x.resale*R/w.km,capN=n.km?(n.price+n.price*n.res/100)/2*R/n.km:0;
  const keep=fuel+oth+proj+dep+capK,newAll=newPk+capN,diff=keep-newAll,yrly=diff*w.km;
  const need=newAll-fuel-oth-dep-capK;
  let when='';
  if(diff<0&&sl>0&&need>proj){const yrs=Math.ceil((need-proj)/sl);when=' If repairs keep rising at the rate of the last '+pts.length+' years, the new car starts to win in about '+yrs+' year'+(yrs>1?'s':'')+' ('+(+cy+yrs)+').'}
  else if(diff<0&&sl<=0)when=' Repairs per km are not rising, so on these numbers keeping it stays cheaper.';
  const verdict=diff<0?'<b class="cpk-dn">Keeping the '+v.name+' is cheaper</b>, by about '+cr(-yrly)+' over the next year.':'<b class="cpk-up">The new car is cheaper</b>, by about '+cr(yrly)+' over the next year, at your '+inr(w.km)+' km a year.';
  return '<h3 style="margin:26px 0 4px;font-size:19px">Keep the '+v.name+' or replace it</h3><p class="pkt" style="margin:0 0 10px">What the next year of the '+v.name+' is likely to cost per km, against the new car above. Money already spent on buying it is left out, because you don’t get it back either way.</p>'
   +'<div class="card ptab"><table><thead><tr><th>Year</th><th>Km</th><th>Repairs</th><th>Per km</th></tr></thead><tbody>'+pts.map(p=>'<tr><td>'+p.y+(p.y===cy?'*':'')+'</td><td>'+inr(yr[p.y].km)+'</td><td>'+cr(yr[p.y].rep)+'</td><td><b>'+pkf(p.r)+'</b></td></tr>').join('')+'</tbody></table></div>'
   +'<div class="card" style="margin-top:12px">'+kv([['Fuel, last 12 months',pkf(fuel)+' a km'],['Insurance, tolls, washing and other',pkf(oth)+' a km'],['Repairs next year (trend '+(sl>=0?'rising':'falling')+' '+pkf(Math.abs(sl))+' a km a year)',pkf(proj)+' a km'],['Resale lost, about '+KR_DROP+'% a year',pkf(dep)+' a km'],['Returns lost on its resale value, '+(R*100).toFixed(1)+'% a year',pkf(capK)+' a km'],['<b>Keeping it, next year</b>','<b>'+pkf(keep)+' a km</b>'],['New car above',pkf(newPk)+' a km'],['Returns lost on the money a new car ties up',pkf(capN)+' a km'],['<b>New car, all in</b>','<b>'+pkf(newAll)+' a km</b>']])
   +'<p class="pkt" style="margin:12px 0 0">'+verdict+when+'</p></div>'
   +'<p class="fn">Repairs are services, parts and labour, without fuel, insurance, tolls or washing. The 12% yearly drop in resale value is my assumption. Lost returns use this year’s rate from Assumptions below, on the average money a new car ties up over the years you keep it. Change the new car’s numbers above and this updates.</p>';
}

    +'<div class="card ptab" style="margin-top:12px"><table><thead><tr><th>'+(CPK.per==='Y'?'Year':'Month')+'</th><th>Km</th><th>Total spent</th><th>Per km</th></tr></thead><tbody>'

    +'</tbody></table></div>'
    +(CPK.per==='M'?'<div class="btnrow"><button class="btn alt sm" id="cpk_more">'+(CPK.more?'Show last 12 months':'Show every month')+'</button></div>':'')
    +'<p class="fn">'+(CPK.lens==='run'?'Fuel, services, repairs, tyres, battery, insurance, tolls, pollution checks and washing. The purchase price and accessories are left out.':(CPK.lens==='buy'?(CPK.basis==='paid'?'Price and accessories exactly when you paid them. A month with a purchase and few km shows a very large cost per km, and resale value is not deducted.':'Price plus accessories, minus the resale values in Assumptions below, spread evenly over every km each vehicle has done. So each km carries the same share, instead of it all landing in the month you paid.'):('Running and maintenance plus the purchase '+(CPK.basis==='paid'?'price as you paid it. A month with a purchase and few km shows a very large cost per km.':'share.'))))+' * Not over yet. Estimated entries are included, and it updates as you add bills, fill-ups and odometer readings.'+(CPK.per==='M'&&CPK.lens!=='buy'?' A tag marks a month that cost more than twice your usual per km, with the biggest bill that month.':'')+'</p>'

   +'<section id="o_res"><h2>Results</h2><p class="lede">Each payment grows from the day you made it, to today.</p><div id="oppres">'+oppResults()+'</div></section>'
   +'<section id="o_km"><h2>Km travelled</h2><p class="lede">Worked out from the odometer readings you entered, assuming steady use between them. It needs an odometer reading for today in your setup, or fill-ups and expenses with the odometer filled in.</p>'+kmTables()+'<p class="fn">Km after your last odometer reading are not counted. A car carries several people and one trip by cab is not always one trip you would have made, so read the public transport and Uber figures as a rough guide.</p></section>'
   +'<section id="o_src"><h2>Sources</h2><p class="lede">Where the starting numbers came from.</p><div class="card">'+kl(SRC.map(s=>s[0]+' <a href="'+s[1]+'" target="_blank" rel="noopener">'+s[2]+'</a>'))+'</div></section>';
  foot.textContent='Rates and resale values are assumptions you can edit. They are saved on this device.';
  curKeys=Object.keys(VEH);
  const upd=()=>{document.getElementById('oppres').innerHTML=oppResults();cpkRender()};
  cpkRender();
  const rd=id=>{const x=parseFloat(document.getElementById(id).value);return isFinite(x)?x:null};
  [['o_pt','pt'],['o_cab','cab'],['o_bike','bike'],['o_inf','inf']].forEach(([id,k])=>document.getElementById(id).addEventListener('input',()=>{const x=rd(id);if(x==null||x<0)return;setOpp({[k]:x});upd()}));
  yrs.forEach(y=>document.getElementById('o_y'+y).addEventListener('input',()=>{const x=rd('o_y'+y);if(x==null)return;const r=getOpp().ret;r[y]=x;setOpp({ret:r});upd()}));
  Object.keys(VEH).forEach(k=>document.getElementById('o_rs_'+k).addEventListener('input',()=>{const x=rd('o_rs_'+k);if(x==null||x<0)return;const r=getOpp().resale;r[k]=x;setOpp({resale:r});upd()}));
  view.querySelectorAll('[data-ret]').forEach(b=>b.addEventListener('click',()=>{const r={};yrs.forEach(y=>{r[y]=b.dataset.ret==='fd'?6.5:OPP_DEF.ret[y]});setOpp({ret:r});yrs.forEach(y=>document.getElementById('o_y'+y).value=r[y]);upd()}));
}

const vseg=document.getElementById('vseg'),bnav=document.getElementById('bnav');
function setShell(key){
  let h='';
  if(VEH[key]){state.lastVeh=key;h=Object.values(VEH).map(v=>'<button data-v="'+v.key+'" aria-pressed="'+(v.key===key)+'">'+v.name+'</button>').join('')}
  else if(key==='intel'||key==='opp')h='<button data-v="intel" aria-pressed="'+(key==='intel')+'">Needs doing</button><button data-v="opp" aria-pressed="'+(key==='opp')+'">What if and cost per km</button>';
  vseg.innerHTML=h;vseg.hidden=!h;
  const cur=VEH[key]?'veh':key==='intel'||key==='opp'?'ins':key==='add'?'add':key==='more'||key==='q'?'more':'home';
  bnav.querySelectorAll('button').forEach(b=>{if(b.dataset.bn===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}
function switchTo(key,keepScroll){
  const prev=state.veh;
  state.veh=key;state.filter='all';state.rf='look';
  if(key==='add'&&VEH[prev])state.addVeh=prev;
  draw(key);setShell(key);qBadge();
  if(!keepScroll)window.scrollTo(0,0);
}
vseg.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(b&&b.dataset.v!==state.veh)switchTo(b.dataset.v)});
bnav.addEventListener('click',e=>{const b=e.target.closest('button[data-bn]');if(!b)return;const k=b.dataset.bn,to=k==='veh'?(state.lastVeh||qfVeh().key):k==='ins'?'intel':k;if(to!==state.veh)switchTo(to);else window.scrollTo(0,0)});
state.veh='';switchTo('home',true);
})();
